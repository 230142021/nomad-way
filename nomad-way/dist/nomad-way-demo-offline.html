<!DOCTYPE html>
<html lang="en">
<head>

  <title>Nomad Way — Your Journey Begins Here</title>
  <meta name="description" content="Nomad Way — a bilingual (EN/RU) travel guide to Kyrgyzstan: destinations, interactive map, trip planner and favorites.">

  <style>
/* ===== Nomad Way — styles ===== */
:root {
  --green: #184E3B;
  --green-2: #1f6650;
  --blue: #3282A6;
  --blue-2: #286b8a;
  --sand: #F2E9D8;
  --sand-2: #e8dbc2;
  --white: #FFFFFF;
  --dark: #202A2B;
  --muted: #5d6b6c;
  --line: rgba(32, 42, 43, .12);
  --radius: 20px;
  --radius-sm: 12px;
  --shadow: 0 10px 30px -12px rgba(24, 78, 59, .28);
  --shadow-lg: 0 24px 50px -20px rgba(24, 78, 59, .45);
  --serif: 'Playfair Display', Georgia, 'Times New Roman', serif;
  --sans: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
  --max: 1200px;
  --ease: cubic-bezier(.2, .7, .2, 1);
}

*, *::before, *::after { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body { margin: 0; font-family: var(--sans); color: var(--dark); background: var(--white); line-height: 1.6; -webkit-font-smoothing: antialiased; }
img, svg { display: block; max-width: 100%; }
a { color: var(--blue); text-decoration: none; }
button { font: inherit; cursor: pointer; }
h1, h2, h3, h4 { font-family: var(--serif); line-height: 1.15; margin: 0 0 .5em; color: var(--dark); font-weight: 700; }
h1 { font-size: clamp(2.2rem, 5vw, 4rem); }
h2 { font-size: clamp(1.7rem, 3.2vw, 2.6rem); }
h3 { font-size: 1.3rem; }
p { margin: 0 0 1em; }
.container { width: min(100% - 40px, var(--max)); margin-inline: auto; }
.section { padding: 80px 0; }
.section--sand { background: var(--sand); }
.section-head { display: flex; justify-content: space-between; align-items: end; gap: 20px; margin-bottom: 32px; flex-wrap: wrap; }
.section-head p { color: var(--muted); max-width: 560px; margin: 0; }
.eyebrow { text-transform: uppercase; letter-spacing: .14em; font-size: .78rem; font-weight: 600; color: var(--blue); margin-bottom: 10px; display: block; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ===== Buttons ===== */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 13px 24px; border-radius: 999px; border: 2px solid transparent; font-weight: 600; font-size: .95rem; transition: transform .25s var(--ease), background .25s, box-shadow .25s, color .25s; white-space: nowrap; }
.btn:hover { transform: translateY(-2px); }
.btn--primary { background: var(--green); color: var(--white); box-shadow: var(--shadow); }
.btn--primary:hover { background: var(--green-2); }
.btn--blue { background: var(--blue); color: var(--white); }
.btn--blue:hover { background: var(--blue-2); }
.btn--ghost { background: transparent; color: var(--green); border-color: var(--green); }
.btn--ghost:hover { background: var(--green); color: var(--white); }
.btn--light { background: rgba(255,255,255,.95); color: var(--green); }
.btn--outline-light { border-color: rgba(255,255,255,.8); color: var(--white); background: rgba(255,255,255,.08); backdrop-filter: blur(4px); }
.btn--outline-light:hover { background: rgba(255,255,255,.2); }
.btn--sm { padding: 8px 16px; font-size: .85rem; }
.btn--danger { background: #b23b3b; color: #fff; }
.btn:disabled { opacity: .6; cursor: not-allowed; transform: none; }

/* ===== Header ===== */
.header { position: sticky; top: 0; z-index: 1000; background: rgba(255,255,255,.92); backdrop-filter: saturate(1.4) blur(12px); border-bottom: 1px solid var(--line); }
.header__inner { display: flex; align-items: center; gap: 24px; height: 72px; }
.logo { display: flex; align-items: center; gap: 10px; color: var(--green); font-family: var(--serif); font-weight: 700; font-size: 1.35rem; }
.logo svg { width: 36px; height: 36px; flex: none; }
.logo > div { white-space: nowrap; }
.logo small { display: block; font-family: var(--sans); font-size: .62rem; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); font-weight: 500; line-height: 1; }
.nav { display: flex; gap: 4px; margin-left: auto; }
.nav a { white-space: nowrap; color: var(--dark); padding: 8px 12px; border-radius: 999px; font-size: .92rem; font-weight: 500; transition: background .2s, color .2s; position: relative; }
.nav a:hover { background: var(--sand); }
.nav a.active { color: var(--green); background: var(--sand); }
.header__actions { display: flex; align-items: center; gap: 8px; }
.lang-switch { display: inline-flex; background: var(--sand); border-radius: 999px; padding: 3px; }
.lang-switch button { border: 0; background: transparent; padding: 6px 12px; border-radius: 999px; font-size: .8rem; font-weight: 700; color: var(--muted); transition: background .2s, color .2s; }
.lang-switch button.active { background: var(--green); color: var(--white); }
.fav-link { position: relative; display: grid; place-items: center; width: 40px; height: 40px; border-radius: 50%; color: var(--green); transition: background .2s; }
.fav-link:hover { background: var(--sand); }
.fav-link svg { width: 22px; height: 22px; }
.badge { position: absolute; top: 2px; right: 0; background: var(--blue); color: #fff; font-size: .65rem; font-weight: 700; min-width: 18px; height: 18px; border-radius: 999px; display: grid; place-items: center; padding: 0 4px; }
.burger { display: none; border: 0; background: var(--sand); width: 42px; height: 42px; border-radius: 50%; color: var(--green); }
.burger svg { width: 22px; height: 22px; margin: auto; }

/* ===== Hero ===== */
.hero { position: relative; min-height: min(88vh, 760px); display: flex; align-items: center; color: var(--white); overflow: hidden; }
.hero__bg { position: absolute; inset: 0; }
.hero__bg svg, .hero__bg img { width: 100%; height: 100%; object-fit: cover; }
.hero__bg::after { content: ''; position: absolute; inset: 0; background: linear-gradient(90deg, rgba(16,40,32,.78) 0%, rgba(16,40,32,.35) 55%, rgba(16,40,32,.05) 100%); }
.hero__content { position: relative; z-index: 2; max-width: 680px; padding: 60px 0; animation: rise .9s var(--ease) both; }
.hero h1 { color: var(--white); margin-bottom: 18px; }
.hero p { font-size: 1.15rem; opacity: .92; max-width: 560px; }
.hero .eyebrow { color: #a9dcf0; }
.hero-search { display: flex; background: var(--white); border-radius: 999px; padding: 6px; margin: 28px 0 22px; box-shadow: var(--shadow-lg); max-width: 560px; }
.hero-search input { flex: 1; border: 0; outline: 0; padding: 12px 20px; font: inherit; color: var(--dark); background: transparent; min-width: 0; }
.hero__ctas { display: flex; gap: 12px; flex-wrap: wrap; }
.hero__stats { display: flex; gap: 36px; margin-top: 44px; flex-wrap: wrap; }
.hero__stats b { font-family: var(--serif); font-size: 2rem; display: block; line-height: 1; }
.hero__stats span { font-size: .85rem; opacity: .85; }
@keyframes rise { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: none; } }

/* ===== Page hero (inner pages) ===== */
.page-hero { position: relative; color: var(--white); padding: 90px 0 70px; overflow: hidden; }
.page-hero__bg { position: absolute; inset: 0; }
.page-hero__bg svg, .page-hero__bg img { width: 100%; height: 100%; object-fit: cover; }
.page-hero__bg::after { content: ''; position: absolute; inset: 0; background: linear-gradient(0deg, rgba(16,40,32,.82), rgba(16,40,32,.35)); }
.page-hero .container { position: relative; z-index: 1; }
.page-hero h1 { color: var(--white); margin-bottom: 10px; }
.page-hero p { opacity: .9; max-width: 640px; font-size: 1.08rem; margin: 0; }
.crumb { display: inline-flex; align-items: center; gap: 6px; color: rgba(255,255,255,.85); font-size: .9rem; margin-bottom: 18px; }
.crumb:hover { color: #fff; }

/* ===== Cards ===== */
.grid { display: grid; gap: 26px; }
.grid--cards { grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); }
.grid--3 { grid-template-columns: repeat(3, 1fr); }
.grid--4 { grid-template-columns: repeat(4, 1fr); }
.card { position: relative; background: var(--white); border-radius: var(--radius); overflow: hidden; box-shadow: 0 2px 6px rgba(0,0,0,.04), 0 0 0 1px var(--line); transition: transform .35s var(--ease), box-shadow .35s var(--ease); display: flex; flex-direction: column; color: inherit; }
.card:hover { transform: translateY(-6px); box-shadow: var(--shadow-lg); }
.card__media { position: relative; aspect-ratio: 4 / 3; overflow: hidden; background: var(--sand); }
.card__media svg, .card__media img { width: 100%; height: 100%; object-fit: cover; transition: transform .7s var(--ease); }
.card:hover .card__media svg, .card:hover .card__media img { transform: scale(1.07); }
.card__body { padding: 18px 20px 20px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
.card__body h3 { margin: 0; font-size: 1.2rem; }
.card__body p { color: var(--muted); font-size: .92rem; margin: 0; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.card__meta { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: auto; padding-top: 8px; font-size: .82rem; color: var(--muted); }
.card__region { position: absolute; left: 14px; top: 14px; background: rgba(255,255,255,.92); color: var(--green); font-size: .74rem; font-weight: 600; padding: 5px 11px; border-radius: 999px; }
.heart { position: absolute; right: 12px; top: 12px; width: 40px; height: 40px; border-radius: 50%; border: 0; background: rgba(255,255,255,.92); color: var(--green); display: grid; place-items: center; transition: transform .2s var(--ease), background .2s; z-index: 2; }
.heart:hover { transform: scale(1.12); }
.heart svg { width: 20px; height: 20px; }
.heart.on { color: #d6455d; }
.heart.on svg path { fill: currentColor; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font-size: .74rem; padding: 4px 10px; border-radius: 999px; background: var(--sand); color: var(--green); font-weight: 600; }
.chip--blue { background: rgba(50,130,166,.12); color: var(--blue-2); }
.diff { display: inline-flex; align-items: center; gap: 6px; font-weight: 600; }
.diff i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
.diff--easy i { background: #3ca06b; } .diff--moderate i { background: #e0a82e; } .diff--hard i { background: #d0573f; }

/* Category tiles */
.cat-tile { position: relative; border-radius: var(--radius); overflow: hidden; min-height: 220px; color: var(--white); display: flex; align-items: end; padding: 22px; transition: transform .35s var(--ease), box-shadow .35s; }
.cat-tile:hover { transform: translateY(-6px); box-shadow: var(--shadow-lg); }
.cat-tile__bg { position: absolute; inset: 0; }
.cat-tile__bg svg { width: 100%; height: 100%; transition: transform .7s var(--ease); }
.cat-tile:hover .cat-tile__bg svg { transform: scale(1.08); }
.cat-tile::after { content: ''; position: absolute; inset: 0; background: linear-gradient(0deg, rgba(16,40,32,.85), transparent 65%); }
.cat-tile > div:not(.cat-tile__bg) { position: relative; z-index: 1; }
.cat-tile h3 { color: var(--white); margin: 0 0 4px; }
.cat-tile p { margin: 0; font-size: .88rem; opacity: .9; }

/* Route cards */
.route-card { background: var(--white); border-radius: var(--radius); padding: 26px; box-shadow: 0 0 0 1px var(--line); display: flex; flex-direction: column; gap: 12px; transition: transform .35s var(--ease), box-shadow .35s; }
.route-card:hover { transform: translateY(-4px); box-shadow: var(--shadow); }
.route-card .route-days { font-family: var(--serif); font-size: 1.8rem; color: var(--green); line-height: 1; }
.route-stops { display: flex; flex-wrap: wrap; gap: 4px 0; font-size: .86rem; color: var(--muted); }
.route-stops span:not(:last-child)::after { content: '→'; margin: 0 6px; color: var(--blue); }

/* Why */
.why { display: grid; grid-template-columns: repeat(3, 1fr); gap: 26px; }
.why__item { padding: 28px; border-radius: var(--radius); background: var(--white); }
.why__icon { width: 52px; height: 52px; border-radius: 16px; display: grid; place-items: center; background: var(--green); color: var(--white); margin-bottom: 16px; }
.why__icon svg { width: 26px; height: 26px; }

/* CTA band */
.cta-band { position: relative; border-radius: 28px; overflow: hidden; color: #fff; padding: 64px 48px; display: flex; justify-content: space-between; align-items: center; gap: 30px; flex-wrap: wrap; }
.cta-band__bg { position: absolute; inset: 0; }
.cta-band__bg svg { width: 100%; height: 100%; }
.cta-band::after { content: ''; position: absolute; inset: 0; background: linear-gradient(90deg, rgba(24,78,59,.92), rgba(50,130,166,.55)); }
.cta-band > div:not(.cta-band__bg) { position: relative; z-index: 1; max-width: 560px; }
.cta-band h2 { color: #fff; }

/* ===== Explore ===== */
.filters { background: var(--white); border-radius: var(--radius); padding: 20px; box-shadow: var(--shadow); display: grid; grid-template-columns: 2fr repeat(4, 1fr); gap: 12px; margin-top: -48px; position: relative; z-index: 5; }
.field { display: flex; flex-direction: column; gap: 6px; }
.field label { font-size: .78rem; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.input, select.input, textarea.input { width: 100%; border: 1.5px solid var(--line); background: var(--white); border-radius: var(--radius-sm); padding: 11px 14px; font: inherit; color: var(--dark); transition: border-color .2s, box-shadow .2s; }
.input:focus { outline: 0; border-color: var(--blue); box-shadow: 0 0 0 4px rgba(50,130,166,.15); }
textarea.input { resize: vertical; min-height: 120px; }
.input-icon { position: relative; }
.input-icon svg { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); width: 18px; height: 18px; color: var(--muted); }
.input-icon .input { padding-left: 40px; }
.results-bar { display: flex; justify-content: space-between; align-items: center; margin: 30px 0 20px; gap: 12px; flex-wrap: wrap; color: var(--muted); }
.results-bar .right { display: flex; gap: 10px; align-items: center; }
.empty { text-align: center; padding: 60px 20px; color: var(--muted); }
.empty svg { width: 64px; height: 64px; margin: 0 auto 16px; color: var(--sand-2); }

/* ===== Destination details ===== */
.detail-hero { position: relative; height: min(70vh, 560px); color: #fff; display: flex; align-items: end; overflow: hidden; }
.detail-hero__bg { position: absolute; inset: 0; }
.detail-hero__bg svg, .detail-hero__bg img { width: 100%; height: 100%; object-fit: cover; }
.detail-hero::after { content: ''; position: absolute; inset: 0; background: linear-gradient(0deg, rgba(16,40,32,.85) 0%, rgba(16,40,32,.1) 60%); }
.detail-hero .container { position: relative; z-index: 1; padding-bottom: 44px; }
.detail-hero h1 { color: #fff; margin-bottom: 12px; }
.detail-hero .chips .chip { background: rgba(255,255,255,.18); color: #fff; backdrop-filter: blur(4px); }
.detail-layout { display: grid; grid-template-columns: 1fr 360px; gap: 48px; align-items: start; }
.detail-main h2 { font-size: 1.7rem; margin-top: 8px; }
.detail-main .lead { font-size: 1.15rem; color: var(--dark); }
.detail-main p { color: #3d4a4b; }
.side-card { background: var(--sand); border-radius: var(--radius); padding: 24px; position: sticky; top: 96px; display: flex; flex-direction: column; gap: 16px; }
.fact { display: flex; justify-content: space-between; gap: 10px; padding-bottom: 12px; border-bottom: 1px solid var(--line); font-size: .92rem; }
.fact:last-of-type { border-bottom: 0; }
.fact span { color: var(--muted); }
.fact b { text-align: right; }
.mini-map { height: 220px; border-radius: var(--radius-sm); overflow: hidden; background: #dfe9e6; }
.activity-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 10px; margin: 0 0 32px; padding: 0; list-style: none; }
.activity-list li { display: flex; align-items: center; gap: 10px; background: var(--white); border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 12px 14px; font-weight: 500; font-size: .92rem; }
.activity-list svg { width: 20px; height: 20px; color: var(--blue); flex: none; }
.tips { list-style: none; padding: 0; margin: 0 0 32px; display: grid; gap: 10px; }
.tips li { display: flex; gap: 12px; padding: 14px 16px; border-radius: var(--radius-sm); background: rgba(50,130,166,.08); }
.tips li svg { width: 20px; height: 20px; color: var(--blue); flex: none; margin-top: 2px; }
.gallery { display: grid; grid-template-columns: 2fr 1fr 1fr; grid-template-rows: 180px 180px; gap: 12px; margin-bottom: 36px; }
.gallery button { border: 0; padding: 0; border-radius: var(--radius-sm); overflow: hidden; background: var(--sand); }
.gallery button:first-child { grid-row: span 2; }
.gallery svg, .gallery img { width: 100%; height: 100%; object-fit: cover; transition: transform .5s var(--ease); }
.gallery button:hover svg, .gallery button:hover img { transform: scale(1.06); }

/* Lightbox */
.lightbox { position: fixed; inset: 0; background: rgba(10,20,18,.92); z-index: 3000; display: none; align-items: center; justify-content: center; padding: 40px; }
.lightbox.open { display: flex; animation: fade .25s ease; }
.lightbox__img { max-width: min(1100px, 100%); width: 100%; aspect-ratio: 16/10; border-radius: var(--radius-sm); overflow: hidden; }
.lightbox__img svg, .lightbox__img img { width: 100%; height: 100%; object-fit: cover; }
.lightbox button { position: absolute; border: 0; background: rgba(255,255,255,.15); color: #fff; width: 48px; height: 48px; border-radius: 50%; font-size: 1.4rem; }
.lightbox button:hover { background: rgba(255,255,255,.3); }
.lightbox .lb-close { top: 20px; right: 20px; }
.lightbox .lb-prev { left: 20px; top: 50%; }
.lightbox .lb-next { right: 20px; top: 50%; }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }

/* ===== Map ===== */
.map-wrap { display: grid; grid-template-columns: 320px 1fr; gap: 0; height: calc(100vh - 72px); min-height: 520px; }
.map-side { overflow: auto; border-right: 1px solid var(--line); background: var(--white); }
.map-side__head { padding: 22px 20px 12px; position: sticky; top: 0; background: var(--white); z-index: 2; border-bottom: 1px solid var(--line); }
.map-side__head h1 { font-size: 1.6rem; margin-bottom: 4px; }
.map-side__head p { font-size: .88rem; color: var(--muted); margin-bottom: 12px; }
.map-list { list-style: none; margin: 0; padding: 8px; }
.map-list li button { width: 100%; display: flex; gap: 12px; align-items: center; text-align: left; border: 0; background: transparent; padding: 10px; border-radius: var(--radius-sm); transition: background .2s; }
.map-list li button:hover, .map-list li button.active { background: var(--sand); }
.map-list .thumb { width: 56px; height: 56px; border-radius: 10px; overflow: hidden; flex: none; }
.map-list .thumb svg, .map-list .thumb img { width: 100%; height: 100%; object-fit: cover; }
.map-list b { display: block; font-size: .92rem; }
.map-list small { color: var(--muted); }
#bigMap { width: 100%; height: 100%; background: #dfe9e6; }
.map-fallback { padding: 30px; color: var(--muted); }
.nw-marker { width: 34px; height: 34px; border-radius: 50% 50% 50% 0; transform: rotate(-45deg); background: var(--green); border: 3px solid #fff; box-shadow: 0 4px 10px rgba(0,0,0,.3); display: grid; place-items: center; }
.nw-marker span { transform: rotate(45deg); color: #fff; font-size: 12px; font-weight: 700; }
.nw-marker.culture { background: #a0552d; } .nw-marker.adventure { background: var(--blue); } .nw-marker.relaxation { background: #2e8a8a; }
.nw-marker.num { background: var(--blue); }
.popup { width: 220px; font-family: var(--sans); }
.popup .thumb { height: 110px; border-radius: 10px; overflow: hidden; margin-bottom: 10px; }
.popup .thumb svg, .popup .thumb img { width: 100%; height: 100%; object-fit: cover; }
.popup b { font-family: var(--serif); font-size: 1.05rem; display: block; margin-bottom: 4px; color: var(--dark); }
.popup p { font-size: .82rem; color: var(--muted); margin: 0 0 10px; }
.leaflet-popup-content-wrapper { border-radius: 16px !important; }
.leaflet-popup-content { margin: 12px !important; }

/* ===== Planner ===== */
.planner { display: grid; grid-template-columns: 1fr; gap: 28px; }
.planner-form { background: var(--white); border-radius: var(--radius); box-shadow: var(--shadow); padding: 32px; margin-top: -48px; position: relative; z-index: 5; }
.q { margin-bottom: 28px; }
.q h3 { display: flex; align-items: center; gap: 12px; font-size: 1.25rem; }
.q h3 .num { width: 32px; height: 32px; border-radius: 50%; background: var(--green); color: #fff; font-family: var(--sans); font-size: .9rem; display: grid; place-items: center; flex: none; }
.q .hint { color: var(--muted); font-size: .85rem; margin: -6px 0 12px 44px; }
.options { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
.options--3 { grid-template-columns: repeat(3, 1fr); }
.opt { position: relative; }
.opt input { position: absolute; opacity: 0; pointer-events: none; }
.opt label { display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; padding: 18px 12px; border: 2px solid var(--line); border-radius: var(--radius-sm); cursor: pointer; transition: border-color .2s, background .2s, transform .2s var(--ease); font-weight: 600; height: 100%; }
.opt label small { font-weight: 400; color: var(--muted); font-size: .8rem; }
.opt label svg { width: 28px; height: 28px; color: var(--blue); }
.opt label:hover { transform: translateY(-2px); border-color: var(--blue); }
.opt input:checked + label { border-color: var(--green); background: rgba(24,78,59,.06); box-shadow: inset 0 0 0 1px var(--green); }
.opt input:checked + label svg { color: var(--green); }
.opt input:focus-visible + label { box-shadow: 0 0 0 4px rgba(50,130,166,.25); }
.plan-result { display: grid; grid-template-columns: 1fr 1fr; gap: 28px; align-items: start; }
.plan-summary { background: var(--green); color: #fff; border-radius: var(--radius); padding: 28px; grid-column: 1 / -1; display: flex; justify-content: space-between; gap: 20px; flex-wrap: wrap; align-items: center; }
.plan-summary h2 { color: #fff; margin-bottom: 6px; font-size: 1.9rem; }
.plan-summary .stats { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 10px; }
.plan-summary .stats span { background: rgba(255,255,255,.14); padding: 6px 12px; border-radius: 999px; font-size: .85rem; }
.plan-summary .actions { display: flex; gap: 10px; flex-wrap: wrap; }
.timeline { list-style: none; margin: 0; padding: 0; position: relative; }
.timeline::before { content: ''; position: absolute; left: 21px; top: 10px; bottom: 10px; width: 2px; background: var(--sand-2); }
.timeline li { position: relative; padding: 0 0 22px 60px; }
.timeline .dot { position: absolute; left: 0; top: 0; width: 44px; height: 44px; border-radius: 50%; background: var(--white); border: 2px solid var(--green); color: var(--green); font-weight: 700; display: grid; place-items: center; font-size: .9rem; }
.timeline li.free .dot { border-color: var(--sand-2); color: var(--muted); }
.timeline .day-card { background: var(--white); border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 14px 16px; }
.timeline .day-card h4 { font-family: var(--sans); font-size: 1rem; margin: 0 0 4px; }
.timeline .day-card h4 a { color: var(--dark); }
.timeline .day-card h4 a:hover { color: var(--blue); }
.timeline .drive { font-size: .8rem; color: var(--blue-2); display: flex; align-items: center; gap: 6px; margin-bottom: 6px; }
.timeline .drive svg { width: 14px; height: 14px; }
.timeline .day-card p { font-size: .86rem; color: var(--muted); margin: 6px 0 0; }
.plan-map { height: 520px; border-radius: var(--radius); overflow: hidden; position: sticky; top: 96px; background: #dfe9e6; }
.saved-routes { display: grid; gap: 12px; }
.saved-route { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 14px 18px; border-radius: var(--radius-sm); background: var(--white); border: 1px solid var(--line); flex-wrap: wrap; }
.saved-route small { color: var(--muted); display: block; }

/* ===== Guide / About ===== */
.guide-nav { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 36px; }
.guide-section { margin-bottom: 56px; scroll-margin-top: 100px; }
.guide-section h2 { display: flex; align-items: center; gap: 14px; }
.guide-section h2 .icon { width: 48px; height: 48px; border-radius: 14px; background: var(--sand); color: var(--green); display: grid; place-items: center; flex: none; }
.guide-section h2 .icon svg { width: 24px; height: 24px; }
.info-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 18px; }
.info-card { background: var(--white); border: 1px solid var(--line); border-radius: var(--radius); padding: 22px 24px; transition: box-shadow .3s, transform .3s var(--ease); }
.info-card:hover { box-shadow: var(--shadow); transform: translateY(-3px); }
.info-card h3 { font-size: 1.12rem; margin-bottom: 8px; }
.info-card p { color: var(--muted); margin: 0; font-size: .95rem; }
.facts-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 56px; }
.fact-tile { background: var(--sand); border-radius: var(--radius); padding: 20px; }
.fact-tile span { display: block; font-size: .78rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin-bottom: 6px; font-weight: 600; }
.fact-tile b { font-family: var(--serif); font-size: 1.2rem; color: var(--green); }
.about-row { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; align-items: center; margin-bottom: 56px; }
.about-row:nth-child(even) .about-row__media { order: 2; }
.about-row__media { border-radius: var(--radius); overflow: hidden; aspect-ratio: 16/11; }
.about-row__media svg { width: 100%; height: 100%; }
.about-row p { color: #3d4a4b; font-size: 1.04rem; }

/* ===== Contact ===== */
.contact-layout { display: grid; grid-template-columns: 1.4fr 1fr; gap: 32px; margin-top: -48px; position: relative; z-index: 5; }
.form-card { background: var(--white); border-radius: var(--radius); box-shadow: var(--shadow); padding: 32px; }
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.form-card .field { margin-bottom: 16px; }
.alert { padding: 12px 16px; border-radius: var(--radius-sm); margin-bottom: 16px; font-size: .92rem; }
.alert--ok { background: rgba(60,160,107,.12); color: #1f6b44; }
.alert--err { background: rgba(208,87,63,.12); color: #9b3725; }
.info-side { background: var(--green); color: #fff; border-radius: var(--radius); padding: 32px; display: flex; flex-direction: column; gap: 18px; }
.info-side h3 { color: #fff; }
.info-line { display: flex; gap: 12px; align-items: center; }
.info-line svg { width: 22px; height: 22px; color: #a9dcf0; flex: none; }
.socials { display: flex; gap: 10px; }
.socials a { width: 42px; height: 42px; border-radius: 50%; background: rgba(255,255,255,.12); color: #fff; display: grid; place-items: center; transition: background .2s, transform .2s; }
.socials a:hover { background: var(--blue); transform: translateY(-2px); }
.socials svg { width: 20px; height: 20px; }

/* ===== Admin ===== */
.admin-wrap { min-height: calc(100vh - 72px); background: var(--sand); padding: 40px 0 80px; }
.login-card { max-width: 420px; margin: 40px auto; background: #fff; border-radius: var(--radius); padding: 36px; box-shadow: var(--shadow); }
.login-card .field { margin-bottom: 16px; }
.admin-top { display: flex; justify-content: space-between; align-items: center; gap: 16px; margin-bottom: 24px; flex-wrap: wrap; }
.tabs { display: flex; gap: 6px; background: #fff; padding: 5px; border-radius: 999px; width: fit-content; margin-bottom: 24px; flex-wrap: wrap; }
.tabs button { border: 0; background: transparent; padding: 9px 18px; border-radius: 999px; font-weight: 600; color: var(--muted); }
.tabs button.active { background: var(--green); color: #fff; }
.stat-cards { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 24px; }
.stat-card { background: #fff; border-radius: var(--radius); padding: 20px; }
.stat-card b { font-family: var(--serif); font-size: 2rem; color: var(--green); display: block; }
.stat-card span { color: var(--muted); font-size: .88rem; }
.panel { background: #fff; border-radius: var(--radius); padding: 24px; overflow: auto; }
.table { width: 100%; border-collapse: collapse; font-size: .92rem; }
.table th, .table td { text-align: left; padding: 12px 10px; border-bottom: 1px solid var(--line); vertical-align: middle; }
.table th { font-size: .76rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.table .thumb { width: 64px; height: 44px; border-radius: 8px; overflow: hidden; }
.table .thumb svg, .table .thumb img { width: 100%; height: 100%; object-fit: cover; }
.table .actions { display: flex; gap: 6px; justify-content: flex-end; }
.edit-form { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.edit-form .full { grid-column: 1 / -1; }
.checks { display: flex; flex-wrap: wrap; gap: 8px 16px; }
.checks label { display: inline-flex; align-items: center; gap: 6px; font-size: .9rem; text-transform: none; letter-spacing: 0; color: var(--dark); font-weight: 500; }
.mode-pill { font-size: .8rem; padding: 6px 12px; border-radius: 999px; background: #fff; color: var(--green); font-weight: 600; }
.code { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: .82rem; min-height: 420px; }

/* ===== Footer ===== */
.footer { background: var(--dark); color: rgba(255,255,255,.75); padding: 64px 0 28px; }
.footer__grid { display: grid; grid-template-columns: 1.6fr 1fr 1fr 1fr; gap: 36px; }
.footer .logo { color: #fff; margin-bottom: 14px; }
.footer .logo small { color: rgba(255,255,255,.6); }
.footer h4 { color: #fff; font-family: var(--sans); font-size: .85rem; text-transform: uppercase; letter-spacing: .1em; margin-bottom: 14px; }
.footer ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.footer a { color: rgba(255,255,255,.75); font-size: .92rem; }
.footer a:hover { color: #fff; }
.footer__bottom { border-top: 1px solid rgba(255,255,255,.12); margin-top: 44px; padding-top: 22px; display: flex; justify-content: space-between; font-size: .85rem; flex-wrap: wrap; gap: 10px; }

/* Toast */
.toast { position: fixed; bottom: 24px; left: 50%; transform: translate(-50%, 120px); background: var(--dark); color: #fff; padding: 12px 22px; border-radius: 999px; font-size: .9rem; z-index: 4000; transition: transform .35s var(--ease), visibility .35s; box-shadow: var(--shadow-lg); visibility: hidden; }
.toast.show { transform: translate(-50%, 0); visibility: visible; }

/* Reveal animation */
.reveal { opacity: 0; transform: translateY(20px); transition: opacity .7s var(--ease), transform .7s var(--ease); }
.reveal.in { opacity: 1; transform: none; }
.page { animation: fade .35s ease; }

/* ===== Responsive ===== */
@media (max-width: 1100px) {
  .nav a { padding: 8px 9px; font-size: .86rem; }
  .filters { grid-template-columns: 1fr 1fr 1fr; }
  .filters .field:first-child { grid-column: 1 / -1; }
}
@media (max-width: 1180px) {
  .nav { position: fixed; inset: 72px 0 auto 0; flex-direction: column; background: #fff; padding: 12px 20px 20px; gap: 2px; border-bottom: 1px solid var(--line); box-shadow: var(--shadow); transform: translateY(-120%); transition: transform .35s var(--ease); z-index: -1; }
  .nav.open { transform: none; }
  .nav a { padding: 12px 14px; font-size: 1rem; }
  .burger { display: grid; }
  .header__actions { margin-left: auto; }
}
@media (max-width: 980px) {
  .detail-layout, .plan-result, .contact-layout { grid-template-columns: 1fr; }
  .side-card, .plan-map { position: static; }
  .plan-map { height: 380px; }
  .grid--3, .why { grid-template-columns: 1fr 1fr; }
  .grid--4, .facts-grid, .stat-cards { grid-template-columns: 1fr 1fr; }
  .footer__grid { grid-template-columns: 1fr 1fr; }
  .map-wrap { grid-template-columns: 1fr; grid-template-rows: 55vh auto; height: auto; }
  .map-side { order: 2; border-right: 0; }
  .about-row { grid-template-columns: 1fr; gap: 20px; }
  .about-row:nth-child(even) .about-row__media { order: 0; }
}
@media (max-width: 640px) {
  .section { padding: 56px 0; }
  .grid--3, .why, .info-grid, .form-row, .edit-form { grid-template-columns: 1fr; }
  .filters { grid-template-columns: 1fr 1fr; padding: 16px; }
  .options { grid-template-columns: 1fr 1fr; }
  .options--3 { grid-template-columns: 1fr; }
  .planner-form, .form-card { padding: 22px; }
  .gallery { grid-template-columns: 1fr 1fr; grid-template-rows: 200px 110px 110px; }
  .gallery button:first-child { grid-column: 1 / -1; grid-row: auto; }
  .cta-band { padding: 40px 26px; }
  .hero__stats { gap: 22px; }
  .hero-search .btn { padding: 12px 16px; }
  .logo small { display: none; }
  .logo { font-size: 1.15rem; }
  .footer__grid { grid-template-columns: 1fr; }
  .lightbox { padding: 12px; }
}

/* ===== Print (PDF export of itinerary) ===== */
@media print {
  .header, .footer, .planner-form, .plan-summary .actions, .plan-map, .saved-block, .page-hero, .toast, .no-print { display: none !important; }
  body { background: #fff; }
  .plan-result { display: block; }
  .plan-summary { background: #fff !important; color: var(--dark) !important; border: 2px solid var(--green); }
  .plan-summary h2, .plan-summary .stats span { color: var(--dark) !important; }
  .timeline li { break-inside: avoid; }
  .section { padding: 0; }
  .print-only { display: block !important; }
}
.print-only { display: none; }

/* Schematic (offline) map + confirm dialog */
.schematic-wrap { position: relative; width: 100%; height: 100%; display: flex; align-items: center; background: #e8efe9; }
.schematic { width: 100%; height: 100%; }
.sm-pt circle { transition: transform .2s var(--ease); transform-box: fill-box; transform-origin: center; }
.sm-pt:hover circle, .sm-pt:focus circle { transform: scale(1.25); }
.sm-pt:focus { outline: none; }
.sm-pop { position: absolute; background: #fff; border-radius: 16px; padding: 12px; box-shadow: var(--shadow-lg); z-index: 5; width: 244px; }
.sm-close { position: absolute; top: 6px; right: 8px; border: 0; background: #fff; width: 28px; height: 28px; border-radius: 50%; font-size: 1.2rem; z-index: 2; }
.confirm-box { background: #fff; border-radius: var(--radius); padding: 24px; max-width: 380px; width: 100%; box-shadow: var(--shadow-lg); }
.confirm-box p { margin-bottom: 18px; font-weight: 500; }

/* Photos */
.cat-tile__bg img, .cta-band__bg img, .about-row__media img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .7s var(--ease); }
.cat-tile:hover .cat-tile__bg img { transform: scale(1.08); }

.hero__bg img { animation: heroZoom 18s ease-out both; }
@keyframes heroZoom { from { transform: scale(1.08); } to { transform: scale(1); } }
@media (prefers-reduced-motion: reduce) { .hero__bg img { animation: none; } }
.credits { font-size: .8rem; color: var(--muted); margin: -24px 0 32px; }
.credits a { color: var(--muted); text-decoration: underline; }
.gallery--1 { grid-template-columns: 1fr; grid-template-rows: 380px; }
.gallery--2 { grid-template-columns: 1fr 1fr; grid-template-rows: 300px; }
.gallery--1 button:first-child, .gallery--2 button:first-child { grid-row: auto; }
.gallery--3 { grid-template-columns: 2fr 1fr; }
.gallery--4 button:nth-child(4) { grid-column: span 2; }
.lightbox__fig { margin: 0; width: min(1100px, 100%); }
.lightbox__fig .lightbox__img { width: 100%; aspect-ratio: auto; max-height: 80vh; background: #000; display: flex; align-items: center; justify-content: center; }
.lightbox__fig .lightbox__img img { width: 100%; height: auto; max-height: 80vh; object-fit: contain; }
.lightbox__fig .lightbox__img svg { aspect-ratio: 16/10; }
.lightbox figcaption { color: rgba(255,255,255,.8); font-size: .85rem; margin-top: 10px; text-align: center; }
.lightbox figcaption a { color: #fff; }

/* Telegram floating button */
.tg-float { position: fixed; right: 20px; bottom: 20px; width: 56px; height: 56px; border-radius: 50%; background: #229ED9; color: #fff; display: grid; place-items: center; box-shadow: 0 10px 24px -8px rgba(34,158,217,.7); z-index: 1500; transition: transform .25s var(--ease); }
.tg-float:hover { transform: scale(1.08); }
.tg-float svg { width: 26px; height: 26px; margin-right: 2px; }
@media print { .tg-float { display: none !important; } }
@media (max-width: 640px) { .gallery--2, .gallery--3 { grid-template-columns: 1fr 1fr; grid-template-rows: 200px 140px; } .gallery--3 button:first-child { grid-column: 1 / -1; grid-row: auto; } .gallery--4 button:nth-child(4) { grid-column: auto; } }
