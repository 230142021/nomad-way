  <script>window.__STATIC__=true;window.__DATA__={"destinations":[{"slug":"issyk-kul","name":{"en":"Issyk-Kul Lake","ru":"Озеро Иссык-Куль"},"region":"issykkul","categories":["nature","relaxation"],"seasons":["summer","autumn"],"difficulty":"easy","scene":"lake","lat":42.45,"lng":77.25,"featured":true,"short":{"en":"The 'pearl of Central Asia' — a vast, never-freezing alpine lake ringed by snowy peaks.","ru":"«Жемчужина Центральной Азии» — огромное незамерзающее высокогорное озеро в кольце снежных вершин."},"description":{"en":"Issyk-Kul is one of the largest alpine lakes in the world, lying at 1,607 m and stretching 182 km between the Kungey and Terskey Ala-Too ranges. Its slightly salty water never freezes, and the northern shore around Cholpon-Ata is famous for sandy beaches, resorts and warm summer swimming, while the quieter southern shore leads to canyons, gorges and yurt camps.","ru":"Иссык-Куль — одно из крупнейших высокогорных озёр мира: оно лежит на высоте 1607 м и тянется на 182 км между хребтами Кунгей и Терскей Ала-Тоо. Слегка солёная вода никогда не замерзает. Северный берег у Чолпон-Аты славится пляжами и курортами, а тихий южный берег ведёт к каньонам, ущельям и юрточным лагерям."},"activities":["swimming","beach","boating","cycling","photography"],"tips":{"en":["Best swimming is July–August.","The south shore is less crowded and great for wild camping.","Bring sunscreen — UV is strong at altitude."],"ru":["Лучшее время для купания — июль–август.","Южный берег менее людный и отлично подходит для кемпинга.","Возьмите солнцезащитный крем — на высоте сильный ультрафиолет."]},"images":["https://commons.wikimedia.org/wiki/Special:FilePath/Lake_Issyk-Kul%2C_Kyrgyzstan.jpg?width=1280","https://commons.wikimedia.org/wiki/Special:FilePath/Issyk-Kul%2C_Kyrgyzstan_%286019934565%29.jpg?width=1280","https://commons.wikimedia.org/wiki/Special:FilePath/Issyk-Kul%2C_Kyrgyzstan_%2843713946455%29.jpg?width=1280"],"credits":["Bgag","Thomas Depenbusch","Wikimedia Commons"]},{"slug":"ala-archa","name":{"en":"Ala-Archa National Park","ru":"Национальный парк Ала-Арча"},"region":"chuy","categories":["nature","hiking","adventure"],"seasons":["spring","summer","autumn","winter"],"difficulty":"moderate","scene":"mountain","lat":42.565,"lng":74.482,"featured":true,"short":{"en":"An alpine gorge just 40 km from Bishkek with glaciers, juniper forests and classic day hikes.","ru":"Альпийское ущелье в 40 км от Бишкека: ледники, арчовые леса и классические однодневные походы."},"description":{"en":"Ala-Archa is the easiest way to reach real high mountains from the capital. Trails climb from juniper and spruce forest to waterfalls, the Ak-Sai glacier and the Ratsek hut at 3,300 m, with views of peaks over 4,800 m. It is popular year-round with hikers, climbers and families on weekend picnics.","ru":"Ала-Арча — самый простой способ попасть в настоящие высокие горы из столицы. Тропы поднимаются от арчового и елового леса к водопадам, леднику Ак-Сай и хижине Рацека на высоте 3300 м с видом на пики выше 4800 м. Парк популярен круглый год у туристов, альпинистов и семей."},"activities":["hiking","climbing","photography","picnic"],"tips":{"en":["Start early — the Ak-Sai waterfall trail takes 4–6 hours return.","There is a small entrance fee at the park gate.","Weather changes fast; carry a warm layer."],"ru":["Выходите рано — тропа к водопаду Ак-Сай занимает 4–6 часов туда и обратно.","На въезде взимается небольшая плата.","Погода меняется быстро — возьмите тёплую одежду."]},"images":["https://commons.wikimedia.org/wiki/Special:FilePath/Ala_Archa_1.JPG?width=1280","https://commons.wikimedia.org/wiki/Special:FilePath/Kyrgyzstan_Ala_Archa_National_Park_03.jpg?width=1280","https://commons.wikimedia.org/wiki/Special:FilePath/%D0%90%D0%BB%D0%B0-%D0%90%D1%80%D1%87%D0%B0%2C_%D0%B2%D0%BE%D0%B4%D0%BE%D0%BF%D0%B0%D0%B4.jpg?width=1280"],"credits":["Mass Ave 975","Vitaliknyc","Wikimedia Commons"]},{"slug":"song-kul","name":{"en":"Song-Kul Lake","ru":"Озеро Сон-Куль"},"region":"naryn","categories":["nature","culture","relaxation"],"seasons":["summer"],"difficulty":"moderate","scene":"lake","lat":41.83,"lng":75.12,"featured":true,"short":{"en":"A high-altitude lake at 3,016 m where nomadic herders spend the summer in yurts.","ru":"Высокогорное озеро на высоте 3016 м, где пастухи-кочевники проводят лето в юртах."},"description":{"en":"Song-Kul sits on a wide jailoo (summer pasture) surrounded by gentle ridges. From June to September shepherd families set up yurts here with their horses, sheep and yaks, and many host travelers. It is the best place to experience nomadic life: horse treks, kymyz, felt-making and endless starry skies.","ru":"Сон-Куль лежит на широком джайлоо (летнем пастбище) среди пологих хребтов. С июня по сентябрь семьи пастухов ставят здесь юрты с лошадьми, овцами и яками, и многие принимают путешественников. Это лучшее место, чтобы прочувствовать кочевую жизнь: конные прогулки, кымыз, войлок и бескрайнее звёздное небо."},"activities":["horse-riding","yurt-stay","photography","stargazing"],"tips":{"en":["Open only June–September; roads close with snow.","Nights are cold even in July — bring warm clothes.","Book a yurt stay through CBT Kochkor or Naryn."],"ru":["Доступно только с июня по сентябрь — дороги закрывает снег.","Ночи холодные даже в июле — нужна тёплая одежда.","Забронируйте юрту через CBT Кочкор или Нарын."]},"images":["https://commons.wikimedia.org/wiki/Special:FilePath/Lake_Son_Kol%2C_Kyrgyzstan.jpg?width=1280","https://commons.wikimedia.org/wiki/Special:FilePath/Song-Kul%2C_Kyrgyzstan_%2829641420357%29.jpg?width=1280","https://commons.wikimedia.org/wiki/Special:FilePath/Song_K%C3%B6l_lake%2C_Kyrgyzstan_%2830035211076%29.jpg?width=1280","https://commons.wikimedia.org/wiki/Special:FilePath/Milky_way%2C_Lake_Son_Kol%2C_Kyrgyzstan.jpg?width=1280"],"credits":["Benjamin Goetzinger","Ninara","Thomas Depenbusch","Wikimedia Commons"]},{"slug":"sary-chelek","name":{"en":"Sary-Chelek Lake","ru":"Озеро Сары-Челек"},"region":"jalalabad","categories":["nature","hiking"],"seasons":["spring","summer","autumn"],"difficulty":"moderate","scene":"forest","lat":41.88,"lng":71.98,"featured":true,"short":{"en":"A turquoise lake in a UNESCO biosphere reserve hidden among walnut and fir forests.","ru":"Бирюзовое озеро в биосферном заповеднике ЮНЕСКО среди орехово-плодовых и пихтовых лесов."},"description":{"en":"Sary-Chelek is a landslide-dammed lake at 1,873 m in the western Tien Shan, part of a UNESCO biosphere reserve. Deep blue water, forested slopes and six smaller lakes nearby make it one of the most beautiful corners of the country. The reserve protects bears, lynx and rare birds.","ru":"Сары-Челек — завальное озеро на высоте 1873 м в Западном Тянь-Шане, часть биосферного заповедника ЮНЕСКО. Глубокая синяя вода, лесистые склоны и шесть малых озёр рядом делают его одним из красивейших уголков страны. Заповедник охраняет медведей, рысей и редких птиц."},"activities":["hiking","boating","birdwatching","photography"],"tips":{"en":["Stay in Arkyt village at the reserve entrance.","Swimming is not allowed in the reserve.","Autumn colors in late September are spectacular."],"ru":["Остановитесь в селе Аркыт у входа в заповедник.","Купаться в заповеднике запрещено.","Осенние краски в конце сентября особенно красивы."]},"images":["https://commons.wikimedia.org/wiki/Special:FilePath/Sary_Chelek_Lake.jpg?width=1280","https://commons.wikimedia.org/wiki/Special:FilePath/Sary_Chelek_Nature_Reserve.jpg?width=1280"],"credits":["Kondephy","Kondephy"]},{"slug":"kel-suu","name":{"en":"Kel-Suu Lake","ru":"Озеро Кёль-Суу"},"region":"naryn","categories":["nature","adventure"],"seasons":["summer"],"difficulty":"hard","scene":"canyon","lat":40.98,"lng":75.64,"featured":true,"short":{"en":"A remote fjord-like lake squeezed between sheer cliffs near the Chinese border.","ru":"Удалённое озеро, похожее на фьорд, зажатое отвесными скалами у границы с Китаем."},"description":{"en":"Kel-Suu lies at 3,500 m in the At-Bashy district and winds for kilometers through vertical rock walls. Reaching it takes a long 4x4 drive, a border-zone permit and a horse ride or hike, but the reward is one of the most dramatic landscapes in Central Asia.","ru":"Кёль-Суу лежит на высоте 3500 м в Ат-Башинском районе и извивается на километры между отвесными скалами. Дорога требует внедорожника, пропуска в погранзону и конного или пешего перехода, но награда — один из самых впечатляющих пейзажей Центральной Азии."},"activities":["horse-riding","hiking","boating","photography"],"tips":{"en":["A border-zone permit is required — arrange 10+ days ahead.","Go with a local driver and guide.","The lake level and color change through the season."],"ru":["Нужен пропуск в погранзону — оформляйте за 10+ дней.","Езжайте с местным водителем и гидом.","Уровень и цвет воды меняются в течение сезона."]},"images":["https://commons.wikimedia.org/wiki/Special:FilePath/Kol-Suu.jpg?width=1280","https://commons.wikimedia.org/wiki/Special:FilePath/%D0%9A%D0%B5%D0%BB%D1%8C-%D0%A1%D1%83%D1%83_-_panoramio_%281%29.jpg?width=1280","https://commons.wikimedia.org/wiki/Special:FilePath/%D0%9A%D0%B5%D0%BB-%D0%A1%D1%83%D1%83.jpg?width=1280"],"credits":["Wikimedia Commons","Wikimedia Commons","Wikimedia Commons"]},{"slug":"karakol","name":{"en":"Karakol","ru":"Каракол"},"region":"issykkul","categories":["culture","adventure","hiking"],"seasons":["spring","summer","autumn","winter"],"difficulty":"easy","scene":"city","lat":42.49,"lng":78.39,"featured":true,"short":{"en":"The adventure capital of Kyrgyzstan with a wooden Orthodox cathedral and Dungan mosque.","ru":"Столица приключений Кыргызстана с деревянным православным собором и дунганской мечетью."},"description":{"en":"Karakol, at the eastern end of Issyk-Kul, is the base for treks to Altyn-Arashan, Ala-Kul and Jeti-Oguz, and for skiing in winter. The town itself has a charming Russian-colonial center, the wooden Holy Trinity Cathedral, a Chinese-style Dungan mosque built without nails, and a lively Sunday animal market.","ru":"Каракол на восточном краю Иссык-Куля — база для походов на Алтын-Арашан, Ала-Куль и Джети-Огуз, а зимой — для лыжного отдыха. В городе уютный центр колониальной эпохи, деревянный Свято-Троицкий собор, дунганская мечеть в китайском стиле, построенная без гвоздей, и оживлённый воскресный скотный рынок."},"activities":["sightseeing","food","hiking","skiing"],"tips":{"en":["Try ashlyan-fu, the local cold noodle dish.","The animal market runs early Sunday morning.","Use the town as a base for 2–4 days."],"ru":["Попробуйте ашлямфу — местное холодное блюдо из лапши.","Скотный рынок работает рано утром в воскресенье.","Сделайте город базой на 2–4 дня."]},"images":["https://commons.wikimedia.org/wiki/Special:FilePath/Holy_Trinity_Church%2C_Karakol_Kyrgyzstan.jpg?width=1280","https://commons.wikimedia.org/wiki/Special:FilePath/Tower_of_Karakol_Dungan_Mosque.jpg?width=1280","https://commons.wikimedia.org/wiki/Special:FilePath/%D0%9A%D0%B0%D1%80%D0%B0%D0%BA%D0%BE%D0%BB%2C_%D0%B4%D1%83%D0%BD%D0%B3%D0%B0%D0%BD%D1%81%D0%BA%D0%B0%D1%8F_%D0%BC%D0%B5%D1%87%D0%B5%D1%82%D1%8C_%D1%81%D0%B2%D0%B5%D1%80%D1%85%D1%83_%282%29.jpg?width=1280","https://commons.wikimedia.org/wiki/Special:FilePath/Karakol_-_91_%2849360924017%29.jpg?width=1280"],"credits":["Kalpak Travel","Adam Harangozó","Nikolai Bulykin","Bruno Rijsman"]},{"slug":"jeti-oguz","name":{"en":"Jeti-Oguz Gorge","ru":"Ущелье Джети-Огуз"},"region":"issykkul","categories":["nature","hiking"],"seasons":["spring","summer","autumn"],"difficulty":"easy","scene":"canyon","lat":42.33,"lng":78.23,"featured":false,"short":{"en":"Famous red sandstone cliffs — the 'Seven Bulls' and the 'Broken Heart' rock.","ru":"Знаменитые красные скалы — «Семь быков» и скала «Разбитое сердце»."},"description":{"en":"Jeti-Oguz is a gorge near Karakol known for its row of red sandstone formations called the Seven Bulls and the split rock known as the Broken Heart. Further up, the valley opens into green meadows, the Valley of Flowers and a pleasant waterfall walk.","ru":"Джети-Огуз — ущелье рядом с Караколом, известное грядой красных скал «Семь быков» и расколотой скалой «Разбитое сердце». Выше долина открывается зелёными лугами, Долиной цветов и приятной прогулкой к водопаду."},"activities":["hiking","horse-riding","photography"],"tips":{"en":["Climb the ridge behind the sanatorium for the best view.","Combine with Karakol in one day.","Local horses can be rented in the valley."],"ru":["Поднимитесь на гребень за санаторием ради лучшего вида.","Легко совместить с Караколом за один день.","В долине можно взять лошадей напрокат."]},"images":["https://commons.wikimedia.org/wiki/Special:FilePath/The_Seven_Bulls.jpg?width=1280","https://commons.wikimedia.org/wiki/Special:FilePath/Jeti-%C3%96g%C3%BCz.jpg?width=1280","https://commons.wikimedia.org/wiki/Special:FilePath/Jeti_Oguz_rock_formation_and_resort.jpg?width=1280"],"credits":["Bernard Gagnon","Bgag","Firespeaker"]},{"slug":"skazka","name":{"en":"Skazka (Fairy Tale) Canyon","ru":"Каньон Сказка"},"region":"issykkul","categories":["nature","hiking"],"seasons":["spring","summer","autumn"],"difficulty":"easy","scene":"canyon","lat":42.155,"lng":77.36,"featured":true,"short":{"en":"Wind-carved red and orange rock shapes that look like castles and dragons.","ru":"Выветренные красно-оранжевые скалы, похожие на замки и драконов."},"description":{"en":"Skazka canyon on the south shore of Issyk-Kul is a short walk through colorful clay and sandstone sculpted by wind and rain into towers, walls and fantastic figures. Climb any ridge for views of the lake. It is especially magical at sunset.","ru":"Каньон Сказка на южном берегу Иссык-Куля — короткая прогулка среди разноцветных глин и песчаников, которые ветер и дождь превратили в башни, стены и фантастические фигуры. С любого гребня открывается вид на озеро. Особенно волшебно здесь на закате."},"activities":["hiking","photography"],"tips":{"en":["Visit late afternoon for warm light.","Wear shoes with grip — the slopes are crumbly.","There is little shade; bring water."],"ru":["Приезжайте ближе к вечеру ради тёплого света.","Нужна обувь с хорошей подошвой — склоны осыпаются.","Тени мало — возьмите воду."]},"images":["https://commons.wikimedia.org/wiki/Special:FilePath/Skazka_Canyon%2C_Kyrgyzstan_%2844573302122%29.jpg?width=1280","https://commons.wikimedia.org/wiki/Special:FilePath/Canyon_de_Skazka.jpg?width=1280","https://commons.wikimedia.org/wiki/Special:FilePath/Skazka_Canyon%2C_Kyrgyzstan_%2843713805835%29.jpg?width=1280"],"credits":["Ninara","Wikimedia Commons","Wikimedia Commons"]},{"slug":"burana","name":{"en":"Burana Tower","ru":"Башня Бурана"},"region":"chuy","categories":["culture"],"seasons":["spring","summer","autumn","winter"],"difficulty":"easy","scene":"historic","lat":42.746,"lng":75.25,"featured":true,"short":{"en":"An 11th-century minaret from the Silk Road city of Balasagun, with ancient balbal stones.","ru":"Минарет XI века древнего города Баласагун на Шёлковом пути и каменные балбалы."},"description":{"en":"The Burana Tower is all that remains of the minaret of Balasagun, a capital of the Karakhanid state. Visitors can climb its narrow inner staircase, see a field of carved Turkic balbal stones and visit a small museum. It is an easy half-day trip from Bishkek.","ru":"Башня Бурана — всё, что осталось от минарета Баласагуна, столицы Караханидского государства. Можно подняться по узкой внутренней лестнице, увидеть поле тюркских каменных изваяний-балбалов и небольшой музей. Лёгкая поездка на полдня из Бишкека."},"activities":["sightseeing","museum","photography"],"tips":{"en":["Combine with Konorchek canyons or Issyk-Kul.","The stairs inside are steep and dark — bring a light.","Early morning has the clearest mountain backdrop."],"ru":["Совместите с каньонами Конорчек или Иссык-Кулем.","Лестница внутри крутая и тёмная — возьмите фонарик.","Ранним утром лучше всего виден горный фон."]},"images":["https://commons.wikimedia.org/wiki/Special:FilePath/Burana_Tower%2C_Kyrgyzstan_01.jpg?width=1280","https://commons.wikimedia.org/wiki/Special:FilePath/Kyrgyzstan_Burana_tower.jpg?width=1280","https://commons.wikimedia.org/wiki/Special:FilePath/Kyrgyzstan_Burana_balbal_field.jpg?width=1280","https://commons.wikimedia.org/wiki/Special:FilePath/Burana_Tower%2C_Kyrgyzstan.jpg?width=1280"],"credits":["Bgag","Wikimedia Commons","Wikimedia Commons","Bernard Gagnon"]},{"slug":"tash-rabat","name":{"en":"Tash Rabat Caravanserai","ru":"Караван-сарай Таш-Рабат"},"region":"naryn","categories":["culture","nature"],"seasons":["summer","autumn"],"difficulty":"moderate","scene":"historic","lat":40.823,"lng":75.288,"featured":true,"short":{"en":"A 15th-century stone caravanserai hidden in a high valley on the Silk Road to China.","ru":"Каменный караван-сарай XV века в высокогорной долине на Шёлковом пути в Китай."},"description":{"en":"Tash Rabat is a remarkably preserved stone building at 3,200 m that once sheltered Silk Road caravans crossing the Torugart pass. Its domed hall and 30 small rooms can be explored, and yurt camps nearby offer overnight stays and horse rides to a viewpoint over Chatyr-Kul lake.","ru":"Таш-Рабат — прекрасно сохранившееся каменное здание на высоте 3200 м, где останавливались караваны, шедшие через перевал Торугарт. Можно осмотреть купольный зал и 30 маленьких комнат, а в юртах неподалёку — переночевать и съездить верхом к смотровой точке над озером Чатыр-Куль."},"activities":["sightseeing","yurt-stay","horse-riding"],"tips":{"en":["Stay overnight in a yurt camp near the site.","It is about 3 hours from Naryn town.","The horse ride to Chatyr-Kul viewpoint needs a permit."],"ru":["Переночуйте в юрточном лагере рядом.","Около 3 часов езды от Нарына.","Для конной поездки к Чатыр-Кулю нужен пропуск."]},"images":["https://commons.wikimedia.org/wiki/Special:FilePath/Tash_Rabat.JPG?width=1280","https://commons.wikimedia.org/wiki/Special:FilePath/Tash_Rabat_in_mountains.jpg?width=1280","https://commons.wikimedia.org/wiki/Special:FilePath/Caravanserai_Tash_Rabat_on_Silk_Road_in_Kyrgyzstan.jpg?width=1280"],"credits":["WikiTofu","Firespeaker","Peter Schepens"]},{"slug":"altyn-arashan","name":{"en":"Altyn-Arashan Valley","ru":"Долина Алтын-Арашан"},"region":"issykkul","categories":["hiking","relaxation","nature"],"seasons":["summer","autumn","winter"],"difficulty":"moderate","scene":"mountain","lat":42.37,"lng":78.62,"featured":false,"short":{"en":"Natural hot springs in an alpine valley beneath the 4,260 m Palatka peak.","ru":"Природные горячие источники в альпийской долине у пика Палатка (4260 м)."},"description":{"en":"Altyn-Arashan ('Golden Spa') is a valley above Karakol where simple guesthouses have pools fed by hot mineral springs. After a 5–6 hour hike or a bumpy 4x4 ride, soaking in hot water surrounded by spruce forest and snowy peaks is unforgettable.","ru":"Алтын-Арашан («Золотой источник») — долина над Караколом, где простые гостевые дома имеют бассейны с горячей минеральной водой. После 5–6 часов пешком или тряской поездки на внедорожнике купание среди ельника и снежных вершин запоминается навсегда."},"activities":["hiking","hot-springs","horse-riding","camping"],"tips":{"en":["Often combined with Ala-Kul as a 3-day trek.","Bring cash — there is no ATM or card payment.","A Soviet truck taxi runs from Ak-Suu village."],"ru":["Часто объединяют с Ала-Кулем в 3-дневный поход.","Возьмите наличные — банкоматов и карт нет.","Из села Ак-Суу ходит советский грузовик-такси."]},"images":["https://commons.wikimedia.org/wiki/Special:FilePath/Altyn_Arashan_resort%2C_Kyrgyzstan.jpg?width=1280","https://commons.wikimedia.org/wiki/Special:FilePath/Arashan_River_in_Altyn_Arashan%2C_Kyrgyzstan.jpg?width=1280","https://commons.wikimedia.org/wiki/Special:FilePath/Yurts_in_Altyn_Arashan%2C_Kyrgyzstan.jpg?width=1280"],"credits":["Adam Harangozó","Adam Harangozó","Wikimedia Commons"]},{"slug":"ala-kul","name":{"en":"Ala-Kul Lake Trek","ru":"Поход к озеру Ала-Куль"},"region":"issykkul","categories":["hiking","adventure","nature"],"seasons":["summer"],"difficulty":"hard","scene":"snow","lat":42.28,"lng":78.53,"featured":true,"short":{"en":"A glacier-fed turquoise lake at 3,560 m reached via a 3,900 m pass.","ru":"Бирюзовое ледниковое озеро на высоте 3560 м за перевалом 3900 м."},"description":{"en":"The Ala-Kul trek is the most famous multi-day hike in Kyrgyzstan. From Karakol the route climbs through forest to the startlingly turquoise lake, then crosses the Ala-Kul pass at 3,900 m and descends to the hot springs of Altyn-Arashan. Good fitness and acclimatization are needed.","ru":"Поход к Ала-Кулю — самый известный многодневный маршрут Кыргызстана. Из Каракола тропа поднимается через лес к поразительно бирюзовому озеру, затем пересекает перевал Ала-Куль (3900 м) и спускается к горячим источникам Алтын-Арашана. Нужна хорошая форма и акклиматизация."},"activities":["trekking","camping","photography"],"tips":{"en":["Season is July to mid-September.","Hire a guide if you have no high-altitude experience.","Camp near the Sirota hut before the lake."],"ru":["Сезон — с июля до середины сентября.","Наймите гида, если нет опыта высокогорья.","Ночуйте у хижины Сирота перед озером."]},"images":["https://commons.wikimedia.org/wiki/Special:FilePath/Ala-K%C3%B6l.jpg?width=1280","https://commons.wikimedia.org/wiki/Special:FilePath/Ala-Kul_lake.jpg?width=1280","https://commons.wikimedia.org/wiki/Special:FilePath/AlaKol.jpg?width=1280"],"credits":["Ondřej Žváček","Wikimedia Commons","Wikimedia Commons"]},{"slug":"chon-kemin","name":{"en":"Chon-Kemin Valley","ru":"Долина Чон-Кемин"},"region":"chuy","categories":["nature","adventure","relaxation"],"seasons":["spring","summer","autumn"],"difficulty":"easy","scene":"forest","lat":42.78,"lng":76.2,"featured":false,"short":{"en":"A green national park valley known for rafting, horse riding and guesthouses.","ru":"Зелёная долина национального парка — рафтинг, конные прогулки и гостевые дома."},"description":{"en":"Chon-Kemin is a long, quiet valley between Bishkek and Issyk-Kul, protected as a national park. Its river is the best place in the country for rafting, and family guesthouses organize horse treks into the side valleys and to alpine lakes.","ru":"Чон-Кемин — длинная тихая долина между Бишкеком и Иссык-Кулем, охраняемая как национальный парк. Её река — лучшее место для рафтинга в стране, а семейные гостевые дома организуют конные походы в боковые ущелья и к альпийским озёрам."},"activities":["rafting","horse-riding","hiking","picnic"],"tips":{"en":["Rafting season is May–September.","A great stop on the way to Issyk-Kul.","Try home-cooked food in local guesthouses."],"ru":["Сезон рафтинга — май–сентябрь.","Отличная остановка по пути на Иссык-Куль.","Попробуйте домашнюю еду в гостевых домах."]},"images":["https://commons.wikimedia.org/wiki/Special:FilePath/Chong_Kemin_National_Park%2C_Kemin_district%2C_Chuy_Region%2C_Kyrgyzstan_01.jpg?width=1280","https://commons.wikimedia.org/wiki/Special:FilePath/Chon-Kemin.JPG?width=1280","https://commons.wikimedia.org/wiki/Special:FilePath/Chong_Kemin_National_Park%2C_Kemin_district%2C_Chuy_Region%2C_Kyrgyzstan_03.jpg?width=1280"],"credits":["Wikimedia Commons","Lupus-sapiens","Wikimedia Commons"]},{"slug":"sulaiman-too","name":{"en":"Sulaiman-Too, Osh","ru":"Сулайман-Тоо, Ош"},"region":"osh","categories":["culture"],"seasons":["spring","summer","autumn","winter"],"difficulty":"easy","scene":"historic","lat":40.53,"lng":72.78,"featured":true,"short":{"en":"A sacred mountain and UNESCO World Heritage Site rising above the 3,000-year-old city of Osh.","ru":"Священная гора — объект ЮНЕСКО над 3000-летним городом Ош."},"description":{"en":"Sulaiman-Too has been a place of pilgrimage for millennia, with petroglyphs, shrines and a cave museum carved into the rock. From the top you overlook Osh, one of the oldest cities in Central Asia, with its huge Jayma bazaar that has traded since Silk Road times.","ru":"Сулайман-Тоо на протяжении тысячелетий был местом паломничества: здесь петроглифы, святыни и пещерный музей в скале. С вершины открывается вид на Ош — один из древнейших городов Центральной Азии с огромным базаром Жайма, торгующим со времён Шёлкового пути."},"activities":["sightseeing","museum","food","photography"],"tips":{"en":["Climb in the morning or at sunset to avoid the heat.","Dress modestly at the shrines.","Try Osh plov at the Jayma bazaar."],"ru":["Поднимайтесь утром или на закате, чтобы избежать жары.","У святынь одевайтесь скромно.","Попробуйте ошский плов на базаре Жайма."]},"images":["https://commons.wikimedia.org/wiki/Special:FilePath/View_of_Osh_from_Sulayman_Mountain_4.jpg?width=1280","https://commons.wikimedia.org/wiki/Special:FilePath/Sulaiman-Too_Mosque_Osh_Kyrgyzstan_%281%29.jpg?width=1280","https://commons.wikimedia.org/wiki/Special:FilePath/Osh_03-2016_img36_Sulayman_Mountain_at_the_viewpoint.jpg?width=1280","https://commons.wikimedia.org/wiki/Special:FilePath/%D0%A1%D1%83%D0%BB%D0%B0%D0%B9%D0%BC%D0%B0%D0%BD-%D0%A2%D0%BE%D0%BE_%D1%81_%D0%B4%D1%80%D0%BE%D0%BD%D0%B0.jpg?width=1280"],"credits":["Adam Harangozó","Radosław Botev","A.Savin","Nefesh03"]},{"slug":"arslanbob","name":{"en":"Arslanbob","ru":"Арсланбоб"},"region":"jalalabad","categories":["nature","hiking","culture"],"seasons":["spring","summer","autumn"],"difficulty":"moderate","scene":"forest","lat":41.33,"lng":72.94,"featured":false,"short":{"en":"The world's largest natural walnut forest, with waterfalls and Uzbek-Kyrgyz village life.","ru":"Крупнейший в мире природный ореховый лес, водопады и жизнь узбекско-кыргызского села."},"description":{"en":"Arslanbob village sits beneath the Babash-Ata range in a vast forest of wild walnut trees. A well-organized community tourism office arranges homestays, walks to the big and small waterfalls, horse trips and multi-day treks to holy lakes.","ru":"Село Арсланбоб лежит у подножия хребта Бабаш-Ата посреди огромного леса диких грецких орехов. Местный офис общинного туризма организует проживание в семьях, прогулки к большому и малому водопадам, конные поездки и многодневные походы к святым озёрам."},"activities":["hiking","homestay","horse-riding","food"],"tips":{"en":["Walnut harvest is in September–October.","Book homestays via CBT Arslanbob.","The big waterfall is an 8 km hike."],"ru":["Сбор орехов — сентябрь–октябрь.","Бронируйте жильё через CBT Арсланбоб.","До большого водопада — 8 км пешком."]},"images":["https://commons.wikimedia.org/wiki/Special:FilePath/Walnut_forest_Arslanbob.jpg?width=1280","https://commons.wikimedia.org/wiki/Special:FilePath/Panorama_in_Arslanbob.jpg?width=1280","https://commons.wikimedia.org/wiki/Special:FilePath/Walnut_forest_in_Arslanbab.jpg?width=1280"],"credits":["Ekrem Canli","surrealpenguin","surrealpenguin"]},{"slug":"lenin-peak","name":{"en":"Lenin Peak Base Camp","ru":"Базовый лагерь пика Ленина"},"region":"osh","categories":["adventure","hiking","nature"],"seasons":["summer"],"difficulty":"hard","scene":"snow","lat":39.65,"lng":72.88,"featured":true,"short":{"en":"Trek to the foot of a 7,134 m giant in the Pamir across the Alay valley.","ru":"Поход к подножию 7134-метрового гиганта Памира через Алайскую долину."},"description":{"en":"Achik-Tash base camp sits at 3,600 m on a flower-filled meadow facing the enormous north face of Lenin Peak. Climbers start expeditions here, but trekkers can visit too — walk to Traveller's Pass (4,150 m) or Tulpar-Kul lake for one of the greatest mountain panoramas in Asia.","ru":"Базовый лагерь Ачик-Таш лежит на высоте 3600 м на цветущем лугу напротив огромной северной стены пика Ленина. Отсюда стартуют экспедиции, но и трекеры могут прийти — к перевалу Путешественников (4150 м) или озеру Тулпар-Куль ради одной из величайших горных панорам Азии."},"activities":["trekking","climbing","camping","photography"],"tips":{"en":["Acclimatize in Sary-Mogol village first.","The season is July–August.","Book camp services with an Osh tour operator."],"ru":["Сначала акклиматизируйтесь в селе Сары-Могол.","Сезон — июль–август.","Бронируйте услуги лагеря у туроператора в Оше."]},"images":["https://commons.wikimedia.org/wiki/Special:FilePath/Peak_Lenin%2C_near_base_camp.jpg?width=1280","https://commons.wikimedia.org/wiki/Special:FilePath/Camp_next_to_Tulpar_Kol_Lake.jpg?width=1280","https://commons.wikimedia.org/wiki/Special:FilePath/Pic_L%C3%A9nine.jpg?width=1280","https://commons.wikimedia.org/wiki/Special:FilePath/Lakes_near_Peak_Lenin_Base_Camp%2C_Kyrgyzstan.jpg?width=1280"],"credits":["Wikimedia Commons","Kondephy","Benoît Vicart","Wikimedia Commons"]},{"slug":"bishkek","name":{"en":"Bishkek","ru":"Бишкек"},"region":"chuy","categories":["culture"],"seasons":["spring","summer","autumn","winter"],"difficulty":"easy","scene":"city","lat":42.875,"lng":74.6,"featured":false,"short":{"en":"The green capital: Soviet boulevards, Ala-Too Square, bazaars and a view of snowy mountains.","ru":"Зелёная столица: советские бульвары, площадь Ала-Тоо, базары и вид на снежные горы."},"description":{"en":"Bishkek is the starting point of most trips. Walk the tree-lined Erkindik boulevard, watch the changing of the guard at Ala-Too Square, visit the State History Museum and Osh Bazaar, and enjoy the city's cafés and restaurants with the Kyrgyz Ala-Too range always on the horizon.","ru":"Бишкек — отправная точка большинства поездок. Прогуляйтесь по зелёному бульвару Эркиндик, посмотрите смену караула на площади Ала-Тоо, загляните в Исторический музей и на Ошский базар, а затем отдохните в кафе с видом на хребет Кыргызский Ала-Тоо."},"activities":["sightseeing","museum","food","shopping"],"tips":{"en":["Osh Bazaar is great for souvenirs and dried fruit.","Use taxi apps for cheap rides.","Try beshbarmak and lagman in local cafés."],"ru":["На Ошском базаре — сувениры и сухофрукты.","Для поездок пользуйтесь такси-приложениями.","Попробуйте бешбармак и лагман в местных кафе."]},"images":["https://commons.wikimedia.org/wiki/Special:FilePath/Bishkek.jpg?width=1280","https://commons.wikimedia.org/wiki/Special:FilePath/E7903-Bishkek-Ala-Too-Square.jpg?width=1280","https://commons.wikimedia.org/wiki/Special:FilePath/Ala-Too_Cinema_with_Relief_in_Bishkek.jpg?width=1280","https://commons.wikimedia.org/wiki/Special:FilePath/Kyrgyz_State_Historical_Museum%2C_Ala_Too_Square%2C_Bishkek%2C_Kyrgyzstan.jpg?width=1280"],"credits":["Almutamid","Vmenkov","Adam Harangozó","Wikimedia Commons"]},{"slug":"karakol-ski","name":{"en":"Karakol Ski Base","ru":"Горнолыжная база Каракол"},"region":"issykkul","categories":["adventure"],"seasons":["winter"],"difficulty":"moderate","scene":"snow","lat":42.43,"lng":78.47,"featured":false,"short":{"en":"The country's best ski resort with spruce-lined runs up to 3,040 m.","ru":"Лучший горнолыжный курорт страны с трассами среди елей до 3040 м."},"description":{"en":"Karakol ski base has modern lifts, long runs through spruce forest and reliable powder from December to March. Freeriders come for the untouched slopes, while beginners will find a ski school and equipment rental. Accommodation is in Karakol town, 7 km away.","ru":"На горнолыжной базе Каракол современные подъёмники, длинные трассы среди ельника и надёжный снег с декабря по март. Фрирайдеры едут за нетронутыми склонами, а новичков ждут лыжная школа и прокат. Жильё — в Караколе, в 7 км."},"activities":["skiing","snowboarding","freeride"],"tips":{"en":["Season is December–March.","Weekdays are much less crowded.","Freeride tours need an avalanche-trained guide."],"ru":["Сезон — декабрь–март.","В будни людей намного меньше.","Для фрирайда нужен гид с лавинной подготовкой."]},"images":["https://commons.wikimedia.org/wiki/Special:FilePath/%D0%93%D0%BE%D1%80%D0%BD%D0%BE%D0%BB%D1%8B%D0%B6%D0%BA%D0%B0.jpg?width=1280","https://commons.wikimedia.org/wiki/Special:FilePath/%D0%92%D0%B8%D0%B4_%D1%81_%D0%BF%D0%B0%D0%BD%D0%BE%D1%80%D0%B0%D0%BC%D1%8B_%D0%BD%D0%B0_%D0%B3%D0%B1_%D0%9A%D0%B0%D1%80%D0%B0%D0%BA%D0%BE%D0%BB.jpg?width=1280","https://commons.wikimedia.org/wiki/Special:FilePath/%D0%93%D0%BE%D1%80%D0%BD%D0%BE%D0%BB%D1%8B%D0%B6%D0%BA%D0%B0_n2.jpg?width=1280"],"credits":["Wikimedia Commons","Wikimedia Commons","Wikimedia Commons"]},{"slug":"barskoon","name":{"en":"Barskoon Gorge & Waterfalls","ru":"Ущелье и водопады Барскоон"},"region":"issykkul","categories":["nature","hiking"],"seasons":["spring","summer","autumn"],"difficulty":"easy","scene":"mountain","lat":42.04,"lng":77.6,"featured":false,"short":{"en":"A green gorge with tall waterfalls and a monument to cosmonaut Yuri Gagarin.","ru":"Зелёное ущелье с высокими водопадами и памятником Юрию Гагарину."},"description":{"en":"Barskoon gorge on the south shore of Issyk-Kul leads up to a series of waterfalls such as 'Tears of the Leopard' and 'Champagne Splashes'. Along the road stands a monument to Yuri Gagarin, who rested here, and yurt cafés serve fresh trout and kymyz.","ru":"Ущелье Барскоон на южном берегу Иссык-Куля ведёт к каскаду водопадов — «Слёзы барса», «Брызги шампанского» и другим. У дороги стоит памятник Юрию Гагарину, отдыхавшему здесь, а в юртах-кафе подают свежую форель и кымыз."},"activities":["hiking","photography","picnic"],"tips":{"en":["The main waterfall is a 20–30 min walk from the road.","Combine with Skazka canyon on the same day.","Taste fresh kymyz in the yurt cafés."],"ru":["До главного водопада 20–30 минут от дороги.","Совместите с каньоном Сказка в один день.","Попробуйте свежий кымыз в юртах-кафе."]},"images":["https://commons.wikimedia.org/wiki/Special:FilePath/Barsko%C3%B6n_Waterfall.jpg?width=1280","https://commons.wikimedia.org/wiki/Special:FilePath/Barskoon._Gagarin._On_the_way_to_Waterfall.jpg?width=1280"],"credits":["Ondřej Žváček","Wikimedia Commons"]},{"slug":"konorchek","name":{"en":"Konorchek Canyons","ru":"Каньоны Конорчек"},"region":"chuy","categories":["hiking","adventure","nature"],"seasons":["spring","autumn"],"difficulty":"moderate","scene":"canyon","lat":42.43,"lng":75.85,"featured":false,"short":{"en":"Labyrinths of red rock towers in the Boom gorge — Kyrgyzstan's 'little Colorado'.","ru":"Лабиринты красных скальных башен в Боомском ущелье — «маленькое Колорадо» Кыргызстана."},"description":{"en":"The Konorchek canyons are a maze of bright red volcanic-sedimentary rock walls and spires a short drive off the Bishkek–Issyk-Kul road. A full-day hike leads through narrow corridors and open amphitheaters. It is hot in summer, so spring and autumn are best.","ru":"Каньоны Конорчек — лабиринт ярко-красных скальных стен и шпилей недалеко от трассы Бишкек–Иссык-Куль. Однодневный поход ведёт по узким коридорам и открытым амфитеатрам. Летом жарко, поэтому лучше весной и осенью."},"activities":["hiking","photography"],"tips":{"en":["Go with a guide — it is easy to get lost.","Carry at least 2–3 liters of water.","Can be combined with Burana Tower."],"ru":["Идите с гидом — заблудиться легко.","Возьмите минимум 2–3 литра воды.","Можно совместить с башней Бурана."]},"images":["https://commons.wikimedia.org/wiki/Special:FilePath/Boom_Gorge_01.jpg?width=1280","https://commons.wikimedia.org/wiki/Special:FilePath/Boom_Gorge_02.jpg?width=1280"],"credits":["Wikimedia Commons","Wikimedia Commons"]},{"slug":"cholpon-ata-petroglyphs","name":{"en":"Cholpon-Ata Petroglyphs","ru":"Петроглифы Чолпон-Аты"},"region":"issykkul","categories":["culture"],"seasons":["spring","summer","autumn"],"difficulty":"easy","scene":"historic","lat":42.665,"lng":77.07,"featured":false,"short":{"en":"An open-air museum of rock carvings up to 3,000 years old on the north shore.","ru":"Музей под открытым небом с наскальными рисунками возрастом до 3000 лет."},"description":{"en":"Above the resort town of Cholpon-Ata lies a field of boulders carved with ibex, snow leopards and hunting scenes dating from the Bronze Age to the Turkic period. The site also offers wide views of Issyk-Kul and the Terskey range across the water.","ru":"Над курортом Чолпон-Ата раскинулось поле валунов с изображениями горных козлов, снежных барсов и сцен охоты — от бронзового века до тюркской эпохи. Отсюда также открывается широкий вид на Иссык-Куль и хребет Терскей на другом берегу."},"activities":["sightseeing","museum","photography"],"tips":{"en":["Visit in the morning before it gets hot.","Hire a local guide to spot the best carvings.","Easy to combine with a beach day."],"ru":["Приходите утром, пока не жарко.","Местный гид покажет лучшие рисунки.","Легко совместить с пляжным днём."]},"images":["https://commons.wikimedia.org/wiki/Special:FilePath/Petroglyph_Museum_of_Cholpon-Ata_09.jpg?width=1280","https://commons.wikimedia.org/wiki/Special:FilePath/Petroglyph_Museum_of_Cholpon-Ata_10.jpg?width=1280","https://commons.wikimedia.org/wiki/Special:FilePath/Petroglyphs%2C_Issyk-Kull_at_Cholpon-Ata%2C_800_BC_to_500_AD%2C_15m0960.jpg?width=1280"],"credits":["Bgag","Bgag","Wikimedia Commons"]},{"slug":"kol-tor","name":{"en":"Kol-Tor Lake","ru":"Озеро Кол-Тор"},"region":"chuy","categories":["hiking","nature"],"seasons":["summer","autumn"],"difficulty":"moderate","scene":"lake","lat":42.58,"lng":75.07,"featured":false,"short":{"en":"A turquoise glacial lake at 2,700 m — a popular day hike from Bishkek.","ru":"Бирюзовое ледниковое озеро на высоте 2700 м — популярный однодневный поход из Бишкека."},"description":{"en":"Kol-Tor lies in the Kegeti valley, about 1.5 hours from Bishkek. The 7 km trail climbs steadily through a forested gorge along a rushing stream and ends at a striking milky-turquoise lake beneath steep peaks.","ru":"Кол-Тор находится в ущелье Кегеты, примерно в 1,5 часах от Бишкека. Тропа длиной 7 км равномерно поднимается по лесистому ущелью вдоль бурного ручья и выводит к молочно-бирюзовому озеру под крутыми пиками."},"activities":["hiking","photography","picnic"],"tips":{"en":["Allow 5–6 hours for the round trip.","The trail is steep in the final section.","Best from June to early October."],"ru":["Закладывайте 5–6 часов туда и обратно.","В конце тропа становится крутой.","Лучше всего с июня до начала октября."]},"images":["https://commons.wikimedia.org/wiki/Special:FilePath/Kol-Tor.jpg?width=1280","https://commons.wikimedia.org/wiki/Special:FilePath/Kol-Tor_June_2022.jpg?width=1280","https://commons.wikimedia.org/wiki/Special:FilePath/Hiking_to_KolTor.jpg?width=1280"],"credits":["Wikimedia Commons","Wikimedia Commons","Aiylchy"]},{"slug":"manas-ordo","name":{"en":"Manas Ordo, Talas","ru":"Манас Ордо, Талас"},"region":"talas","categories":["culture"],"seasons":["spring","summer","autumn"],"difficulty":"easy","scene":"historic","lat":42.48,"lng":72.47,"featured":false,"short":{"en":"A memorial complex dedicated to Manas, the hero of the Kyrgyz national epic.","ru":"Мемориальный комплекс, посвящённый Манасу — герою кыргызского национального эпоса."},"description":{"en":"Manas Ordo in the Talas valley includes the 14th-century Manas Gumbez mausoleum, a museum of the epic of Manas — one of the longest poems in the world — and the hill of Kenkol where ceremonies are held. It is the heart of Kyrgyz cultural identity.","ru":"Манас Ордо в Таласской долине включает мавзолей Гумбез Манаса XIV века, музей эпоса «Манас» — одного из самых длинных поэтических произведений в мире — и холм, где проводятся церемонии. Это сердце кыргызской культурной идентичности."},"activities":["sightseeing","museum"],"tips":{"en":["Reach Talas via the scenic Ötmök pass.","Ask about manaschy (epic singers) performances.","Combine with Besh-Tash national park."],"ru":["Езжайте в Талас через живописный перевал Отмок.","Спросите о выступлениях манасчи (сказителей).","Совместите с нацпарком Беш-Таш."]},"images":["https://commons.wikimedia.org/wiki/Special:FilePath/Manas_Mausoleum.jpg?width=1280"],"credits":["Miflhanc"]}],"routes":[{"id":"bishkek-around","duration":"1-3","title":{"en":"Bishkek & Mountain Day Trips","ru":"Бишкек и горы рядом"},"summary":{"en":"The capital plus easy escapes to alpine gorges and the Silk Road.","ru":"Столица и лёгкие выезды в горные ущелья и на Шёлковый путь."},"interests":["nature","mountains","culture"],"start":"bishkek","stops":["bishkek","ala-archa","kol-tor","burana","konorchek"]},{"id":"issykkul-escape","duration":"1-3","title":{"en":"Issyk-Kul Short Escape","ru":"Короткий отдых на Иссык-Куле"},"summary":{"en":"Beaches, petroglyphs and the colorful south-shore canyons.","ru":"Пляжи, петроглифы и разноцветные каньоны южного берега."},"interests":["nature","culture"],"start":"issyk-kul","stops":["issyk-kul","cholpon-ata-petroglyphs","skazka","barskoon"]},{"id":"karakol-weekend","duration":"1-3","title":{"en":"Karakol Adventure Weekend","ru":"Приключенческие выходные в Караколе"},"summary":{"en":"Red cliffs, hot springs and — in winter — powder skiing.","ru":"Красные скалы, горячие источники, а зимой — лыжи по пухляку."},"interests":["mountains","adventure"],"start":"karakol","stops":["karakol","jeti-oguz","altyn-arashan","karakol-ski"]},{"id":"issykkul-loop","duration":"4-7","title":{"en":"Classic Issyk-Kul Loop","ru":"Классическое кольцо Иссык-Куля"},"summary":{"en":"A full circle around the great lake: valleys, culture, canyons and Karakol.","ru":"Полный круг вокруг озера: долины, культура, каньоны и Каракол."},"interests":["nature","culture"],"start":"bishkek","stops":["bishkek","burana","chon-kemin","cholpon-ata-petroglyphs","issyk-kul","karakol","jeti-oguz","skazka","barskoon"]},{"id":"karakol-mountains","duration":"4-7","title":{"en":"Peaks & Hot Springs of Karakol","ru":"Вершины и источники Каракола"},"summary":{"en":"The famous Ala-Kul trek, Altyn-Arashan springs and alpine valleys.","ru":"Знаменитый поход к Ала-Кулю, источники Алтын-Арашана и альпийские долины."},"interests":["mountains","adventure","nature"],"start":"bishkek","stops":["bishkek","ala-archa","issyk-kul","karakol","ala-kul","altyn-arashan","karakol-ski","jeti-oguz"]},{"id":"nomad-heartland","duration":"8-14","title":{"en":"Nomad Heartland","ru":"Сердце кочевников"},"summary":{"en":"Yurt stays at Song-Kul, the Silk Road caravanserai and remote Kel-Suu.","ru":"Юрты на Сон-Куле, караван-сарай Шёлкового пути и далёкий Кёль-Суу."},"interests":["culture","nature","adventure"],"start":"bishkek","stops":["bishkek","burana","konorchek","song-kul","kel-suu","tash-rabat","barskoon","skazka","jeti-oguz","karakol","issyk-kul","cholpon-ata-petroglyphs"]},{"id":"south-pamir","duration":"8-14","title":{"en":"The South: Walnut Forests, Osh & Pamir","ru":"Юг: ореховые леса, Ош и Памир"},"summary":{"en":"Ancient Osh, the Lenin Peak base camp and lakes of the western Tien Shan.","ru":"Древний Ош, лагерь под пиком Ленина и озёра Западного Тянь-Шаня."},"interests":["mountains","adventure","culture"],"start":"bishkek","stops":["bishkek","manas-ordo","sary-chelek","arslanbob","sulaiman-too","lenin-peak"]},{"id":"grand-kyrgyzstan","duration":"14+","title":{"en":"Grand Kyrgyzstan","ru":"Большой Кыргызстан"},"summary":{"en":"The whole country: north, Issyk-Kul, the Naryn highlands and the south.","ru":"Вся страна: север, Иссык-Куль, нарынское высокогорье и юг."},"interests":["nature","mountains","culture","adventure"],"start":"bishkek","stops":["bishkek","ala-archa","burana","konorchek","chon-kemin","cholpon-ata-petroglyphs","issyk-kul","karakol","ala-kul","altyn-arashan","karakol-ski","jeti-oguz","skazka","barskoon","song-kul","kel-suu","tash-rabat","sulaiman-too","lenin-peak","arslanbob","sary-chelek","manas-ordo"]}]};window.__I18N__={"en":{"meta":{"title":"Nomad Way — Your Journey Begins Here","tagline":"Your Journey Begins Here"},"nav":{"home":"Home","explore":"Explore","map":"Map","planner":"Trip Planner","guide":"Travel Guide","about":"About Kyrgyzstan","favorites":"Favorites","contact":"Contact","admin":"Admin","menu":"Menu"},"hero":{"eyebrow":"Kyrgyzstan · Tien Shan · Silk Road","title":"Discover the land of celestial mountains","text":"Alpine lakes, nomad yurts, Silk Road towers and trails that lead above the clouds. Find your places and build a route in minutes.","searchPlaceholder":"Search destinations — e.g. Song-Kul, Karakol…","searchBtn":"Search","ctaPlan":"Plan my trip","ctaExplore":"Explore destinations","stat1":"destinations","stat2":"of the country is mountains","stat3":"alpine lakes"},"home":{"popular":"Popular destinations","popularText":"Places travelers love most — from turquoise lakes to ancient caravan stops.","seeAll":"See all destinations","categories":"Travel your way","routes":"Recommended routes","routesText":"Ready-made itineraries you can customize in the Trip Planner.","openPlanner":"Customize in planner","whyTitle":"Why Kyrgyzstan?","why":[{"title":"Wild nature","text":"Over 90% of the country is mountains, with thousands of lakes and glaciers."},{"title":"Living nomad culture","text":"Stay in a yurt, ride horses with shepherds, taste kymyz and fresh bread."},{"title":"Easy to visit","text":"Visa-free entry for many nationalities and friendly, affordable travel."}],"ctaTitle":"Ready for your journey?","ctaText":"Tell us how many days you have and what you love — we will suggest a day-by-day route."},"explore":{"title":"Explore destinations","text":"Search and filter places across all regions of Kyrgyzstan.","search":"Search by name…","region":"Region","category":"Category","season":"Season","difficulty":"Difficulty","all":"All","reset":"Reset filters","results":"{n} destinations found","noResults":"No destinations match your filters. Try resetting them.","sort":"Sort","sortFeatured":"Popular first","sortName":"Name A–Z"},"regions":{"chuy":"Chuy","issykkul":"Issyk-Kul","naryn":"Naryn","jalalabad":"Jalal-Abad","osh":"Osh","talas":"Talas","batken":"Batken"},"categories":{"nature":"Nature","adventure":"Adventure","culture":"Culture","hiking":"Hiking","relaxation":"Relaxation"},"categoryText":{"nature":"Lakes, valleys and national parks","adventure":"Treks, rafting, skiing and peaks","culture":"Silk Road heritage and nomad life","hiking":"Day hikes and multi-day trails","relaxation":"Beaches, hot springs and calm"},"seasons":{"spring":"Spring","summer":"Summer","autumn":"Autumn","winter":"Winter"},"difficulty":{"easy":"Easy","moderate":"Moderate","hard":"Challenging"},"activities":{"swimming":"Swimming","beach":"Beach","boating":"Boating","cycling":"Cycling","photography":"Photography","hiking":"Hiking","climbing":"Climbing","picnic":"Picnic","horse-riding":"Horse riding","yurt-stay":"Yurt stay","stargazing":"Stargazing","birdwatching":"Birdwatching","sightseeing":"Sightseeing","food":"Local food","skiing":"Skiing","museum":"Museum","hot-springs":"Hot springs","camping":"Camping","trekking":"Trekking","rafting":"Rafting","homestay":"Homestay","snowboarding":"Snowboarding","freeride":"Freeride","shopping":"Shopping"},"dest":{"back":"Back to destinations","about":"About","activities":"Activities","tips":"Travel tips","location":"Location","facts":"Quick facts","bestSeason":"Best season","openMap":"Open on the big map","gallery":"Photo gallery","save":"Save to favorites","saved":"Saved","similar":"You may also like","notFound":"Destination not found.","coords":"Coordinates","addPlanner":"Plan a trip here","photos":"Photos"},"map":{"title":"Interactive map","text":"Click a marker to see the place and open its page.","open":"Open page","filterAll":"All categories","loading":"Loading map…","offline":"The map could not be loaded (no internet connection to the map tiles). Destinations are listed below.","schematic":"Schematic map"},"planner":{"title":"Trip Planner","text":"Answer four quick questions and get a personalized day-by-day route.","step1":"How long is your trip?","step2":"What are you interested in?","step2hint":"Choose one or more","step3":"When are you traveling?","step4":"What is your travel style?","durations":{"1-3":"1–3 days","4-7":"4–7 days","8-14":"8–14 days","14+":"14+ days"},"interests":{"nature":"Nature","mountains":"Mountains","culture":"Culture","adventure":"Adventure"},"styles":{"relaxed":"Relaxed","balanced":"Balanced","active":"Active"},"styleText":{"relaxed":"Fewer places, more time in each","balanced":"A mix of moving and resting","active":"See as much as possible"},"generate":"Generate my route","regenerate":"Change answers","result":"Your suggested route","days":"{n} days","stops":"{n} places","km":"≈ {n} km on the road","day":"Day {n}","start":"Start in","arrive":"Travel to","explore":"Explore","free":"Free day / rest in","drive":"≈ {km} km · {h} h drive from {from}","freeText":"Relax, wander at your own pace or add an optional activity.","saveRoute":"Save route","routeSaved":"Route saved!","exportPdf":"Export as PDF","savedRoutes":"Saved routes","noSaved":"You have no saved routes yet.","delete":"Delete","open":"Open","based":"Based on template","seasonNote":"Only places that are accessible in {season} are included.","shareTg":"Send to Telegram"},"favorites":{"title":"Favorites","text":"Your saved destinations — stored in this browser.","empty":"You have not saved any destinations yet.","browse":"Browse destinations","clear":"Clear all","confirmClear":"Remove all favorites?"},"contact":{"title":"Contact us","text":"Questions about traveling in Kyrgyzstan? Write to us and we will reply within 1–2 days.","name":"Your name","email":"Email","subject":"Subject","message":"Message","send":"Send message","sending":"Sending…","success":"Thank you! Your message has been sent.","error":"Something went wrong. Please try again.","required":"Please fill in all required fields.","invalidEmail":"Please enter a valid email address.","info":"Contact information","address":"Bishkek, Kyrgyzstan","follow":"Follow us","owner":"Contact person","phone":"Phone","writeTg":"Message on Telegram","tgNote":"Messages from the form are also delivered to our Telegram."},"guide":{"title":"Travel guide","text":"Everything you need to know before your trip.","sections":[{"id":"transport","icon":"bus","title":"Getting around","items":[{"title":"Arriving","text":"Most travelers arrive at Manas International Airport (FRU) in Bishkek or Osh Airport (OSS). Taxi apps work in both cities."},{"title":"Shared taxis & marshrutkas","text":"Minibuses (marshrutkas) and shared taxis connect all towns cheaply. In Bishkek they leave from the Western and Eastern bus stations."},{"title":"Car with driver","text":"For remote places like Song-Kul or Kel-Suu, hire a 4x4 with a driver through a local tour company or CBT office."},{"title":"Domestic flights","text":"Flights between Bishkek and Osh take about 1 hour and save a long 10–12 hour drive."}]},{"id":"seasons","icon":"sun","title":"When to go","items":[{"title":"Summer (June–September)","text":"The main season. High passes and jailoos are open, yurt camps work, and Issyk-Kul is warm enough for swimming."},{"title":"Spring (April–May)","text":"Green valleys and blooming hills, great for canyons and lower hikes. High mountains still have snow."},{"title":"Autumn (September–October)","text":"Golden forests, clear skies and walnut harvest in Arslanbob. Nights get cold in the mountains."},{"title":"Winter (December–March)","text":"Skiing in Karakol and around Bishkek, hot springs and snowy landscapes. Many high roads are closed."}]},{"id":"culture","icon":"yurt","title":"Culture & etiquette","items":[{"title":"Hospitality","text":"Guests are honored. If invited for tea, accept at least one cup; bread (nan) should never be put upside down or thrown away."},{"title":"In a yurt","text":"The place opposite the door (tör) is for honored guests. Don't step on the threshold and take off your shoes inside."},{"title":"Dress","text":"Casual clothes are fine in cities. Dress modestly at mosques, shrines and in rural villages."},{"title":"Language","text":"Kyrgyz and Russian are official. A few words help a lot: Salamatsyzby (hello), Rakhmat (thank you)."}]},{"id":"useful","icon":"info","title":"Useful information","items":[{"title":"Visa","text":"Citizens of many countries can visit visa-free for up to 60 days. Always check the latest rules before you travel."},{"title":"Money","text":"The currency is the Kyrgyz som (KGS). Cards work in cities; carry cash for villages, yurt camps and markets."},{"title":"SIM & internet","text":"Buy a local SIM (Beeline, MegaCom, O!) at the airport with your passport. Mobile internet is cheap and fast in towns."},{"title":"Safety","text":"Kyrgyzstan is generally safe. In the mountains, tell someone your plan, watch the weather and consider a guide for high treks."},{"title":"Border zones","text":"Areas near the Chinese and Tajik borders (e.g. Kel-Suu, Chatyr-Kul) need a border-zone permit arranged in advance."}]}]},"about":{"title":"About Kyrgyzstan","text":"A mountainous country in the heart of Central Asia, on the ancient Silk Road.","factsTitle":"Key facts","facts":[{"label":"Capital","value":"Bishkek"},{"label":"Area","value":"199,951 km²"},{"label":"Population","value":"≈ 7 million"},{"label":"Languages","value":"Kyrgyz, Russian"},{"label":"Currency","value":"Kyrgyz som (KGS)"},{"label":"Highest peak","value":"Jengish Chokusu, 7,439 m"},{"label":"Time zone","value":"UTC+6"},{"label":"Largest lake","value":"Issyk-Kul, 6,236 km²"}],"sections":[{"title":"Land of mountains","text":"The Tien Shan and Pamir-Alay ranges cover more than 90% of Kyrgyzstan. Glaciers feed thousands of rivers and lakes, and summer pastures (jailoo) stretch across high plateaus where herders still move with their animals."},{"title":"History on the Silk Road","text":"For centuries caravans crossed this land between China and the West. Cities like Balasagun, Osh and Uzgen flourished, leaving towers, caravanserais and petroglyphs. Kyrgyzstan became an independent republic in 1991."},{"title":"Nomadic heritage","text":"The yurt (boz üy) is the symbol of Kyrgyz culture — its crown (tündük) is even on the national flag. Horse games like kok-boru, felt carpets (shyrdak), the white kalpak hat and the World Nomad Games keep traditions alive."},{"title":"The epic of Manas","text":"The epic of Manas tells the story of the hero who united the Kyrgyz tribes. It is one of the longest epic poems in the world and is recited by storytellers called manaschy."},{"title":"Food","text":"Try beshbarmak (noodles with meat), plov, lagman, manty, samsa from a tandoor oven, fresh boorsok and drinks like kymyz (fermented mare's milk) and maksym."}]},"admin":{"title":"Administrator panel","login":"Log in","logout":"Log out","username":"Username","password":"Password","loginError":"Wrong username or password.","demoHint":"Demo mode: username admin, password admin123. Changes are saved in this browser.","dashboard":"Dashboard","destinations":"Destinations","messages":"Messages","routes":"Route templates","add":"Add destination","edit":"Edit","delete":"Delete","save":"Save changes","cancel":"Cancel","confirmDelete":"Delete this destination?","saved":"Saved successfully.","noMessages":"No messages yet.","slug":"Slug (URL id)","nameEn":"Name (EN)","nameRu":"Name (RU)","shortEn":"Short description (EN)","shortRu":"Short description (RU)","descEn":"Description (EN)","descRu":"Description (RU)","lat":"Latitude","lng":"Longitude","images":"Photo URLs (one per line)","featured":"Show on homepage","activitiesLbl":"Activities (comma separated keys)","tipsEn":"Tips EN (one per line)","tipsRu":"Tips RU (one per line)","scene":"Illustration style","total":"Total destinations","featuredCount":"Featured","messagesCount":"Messages","routesCount":"Route templates","routesJson":"Route templates (JSON)","invalidJson":"Invalid JSON.","mode":"Mode","modeServer":"Server + database","modeLocal":"Demo (browser storage)","resetDemo":"Reset demo data","from":"From","date":"Date","credits":"Photo authors (one per line, same order as the photos)"},"footer":{"text":"A bilingual travel guide to Kyrgyzstan's mountains, lakes and nomad culture.","explore":"Explore","info":"Information","rights":"All rights reserved.","photos":"Photos: Wikimedia Commons contributors (CC licenses)."},"common":{"loading":"Loading…","details":"Details","close":"Close","days":"days","language":"Language","toastFav":"Added t":"Тема","message":"Сообщение","send":"Отправить","sending":"Отправка…","success":"Спасибо! Ваше сообщение отправлено.","error":"Что-то пошло не так. Попробуйте ещё раз.","required":"Пожалуйста, заполните все обязательные поля.","invalidEmail":"Введите корректный email.","info":"Контактная информация","address":"Бишкек, Кыргызстан","follow":"Мы в соцсетях","owner":"Контактное лицо","phone":"Телефон","writeTg":"Написать в Telegram","tgNote":"Сообщения из формы тоже приходят нам в Telegram."},"guide":{"title":"Путеводитель","text":"Всё, что нужно знать перед поездкой.","sections":[{"id":"transport","icon":"bus","title":"Транспорт","items":[{"title":"Прибытие","text":"Большинство путешественников прилетает в международный аэропорт Манас (FRU) в Бишкеке или в аэропорт Ош (OSS). В обоих городах работают такси-приложения."},{"title":"Маршрутки и попутные такси","text":"Маршрутки и такси «на места» недорого связывают все города. В Бишкеке они отправляются с Западного и Восточного автовокзалов."},{"title":"Машина с водителем","text":"Для удалённых мест вроде Сон-Куля или Кёль-Суу наймите внедорожник с водителем через местную турфирму или офис CBT."},{"title":"Внутренние рейсы","text":"Перелёт Бишкек–Ош занимает около часа и экономит 10–12 часов дороги."}]},{"id":"seasons","icon":"sun","title":"Когда ехать","items":[{"title":"Лето (июнь–сентябрь)","text":"Основной сезон. Открыты перевалы и джайлоо, работают юрточные лагеря, Иссык-Куль прогревается для купания."},{"title":"Весна (апрель–май)","text":"Зелёные долины и цветущие холмы — отлично для каньонов и невысоких походов. В высоких горах ещё снег."},{"title":"Осень (сентябрь–октябрь)","text":"Золотые леса, ясное небо и сбор орехов в Арсланбобе. Ночи в горах холодные."},{"title":"Зима (декабрь–март)","text":"Лыжи в Караколе и под Бишкеком, горячие источники и снежные пейзажи. Многие высокогорные дороги закрыты."}]},{"id":"culture","icon":"yurt","title":"Культура и этикет","items":[{"title":"Гостеприимство","text":"Гость — почётный человек. Если зовут на чай, выпейте хотя бы одну пиалу; хлеб (нан) нельзя класть вверх дном или выбрасывать."},{"title":"В юрте","text":"Место напротив входа (төр) — для почётных гостей. Не наступайте на порог и снимайте обувь внутри."},{"title":"Одежда","text":"В городах подходит обычная одежда. В мечетях, у святынь и в сёлах одевайтесь скромно."},{"title":"Язык","text":"Официальные языки — кыргызский и русский. Несколько слов очень помогут: Саламатсызбы (здравствуйте), Рахмат (спасибо)."}]},{"id":"useful","icon":"info","title":"Полезная информация","items":[{"title":"Виза","text":"Граждане многих стран могут находиться без визы до 60 дней. Перед поездкой обязательно проверьте актуальные правила."},{"title":"Деньги","text":"Валюта — кыргызский сом (KGS). Карты принимают в городах; в сёлах, юртах и на базарах нужны наличные."},{"title":"SIM и интернет","text":"Купите местную SIM-карту (Beeline, MegaCom, O!) в аэропорту по паспорту. Мобильный интернет недорогой и быстрый в городах."},{"title":"Безопасность","text":"Кыргызстан в целом безопасен. В горах сообщайте свой план, следите за погодой и берите гида на высокие маршруты."},{"title":"Погранзоны","text":"Для районов у границ с Китаем и Таджикистаном (например, Кёль-Суу, Чатыр-Куль) нужен пропуск, оформляемый заранее."}]}]},"about":{"title":"О Кыргызстане","text":"Горная страна в сердце Центральной Азии на древнем Шёлковом пути.","factsTitle":"Основные факты","facts":[{"label":"Столица","value":"Бишкек"},{"label":"Площадь","value":"199 951 км²"},{"label":"Население","value":"≈ 7 млн человек"},{"label":"Языки","value":"Кыргызский, русский"},{"label":"Валюта","value":"Кыргызский сом (KGS)"},{"label":"Высшая точка","value":"Жеңиш чокусу, 7439 м"},{"label":"Часовой пояс","value":"UTC+6"},{"label":"Крупнейшее озеро","value":"Иссык-Куль, 6236 км²"}],"sections":[{"title":"Страна гор","text":"Тянь-Шань и Памиро-Алай покрывают более 90% территории Кыргызстана. Ледники питают тысячи рек и озёр, а летние пастбища (джайлоо) раскинулись на высоких плато, где пастухи до сих пор кочуют со скотом."},{"title":"История на Шёлковом пути","text":"Веками через эту землю шли караваны между Китаем и Западом. Процветали Баласагун, Ош и Узген, оставив башни, караван-сараи и петроглифы. В 1991 году Кыргызстан стал независимой республикой."},{"title":"Кочевое наследие","text":"Юрта (боз үй) — символ кыргызской культуры, её купол (түндүк) изображён даже на государственном флаге. Конные игры кок-бору, войлочные ковры шырдак, белый калпак и Всемирные игры кочевников сохраняют традиции."},{"title":"Эпос «Манас»","text":"Эпос «Манас» рассказывает о богатыре, объединившем кыргызские племена. Это одно из самых длинных эпических произведений в мире; его исполняют сказители-манасчи."},{"title":"Кухня","text":"Попробуйте бешбармак, плов, лагман, манты, самсу из тандыра, свежие боорсоки и напитки — кымыз (кобылье молоко) и максым."}]},"admin":{"title":"Панель администратора","login":"Войти","logout":"Выйти","username":"Логин","password":"Пароль","loginError":"Неверный логин или пароль.","demoHint":"Демо-режим: логин admin, пароль admin123. Изменения сохраняются в этом браузере.","dashboard":"Панель","destinations":"Направления","messages":"Сообщения","routes":"Шаблоны маршрутов","add":"Добавить направление","edit":"Изменить","delete":"Удалить","save":"Сохранить","cancel":"Отмена","confirmDelete":"Удалить это направление?","saved":"Успешно сохранено.","noMessages":"Сообщений пока нет.","slug":"Slug (id в адресе)","nameEn":"Название (EN)","nameRu":"Название (RU)","shortEn":"Краткое описание (EN)","shortRu":"Краткое описание (RU)","descEn":"Описание (EN)","descRu":"Описание (RU)","lat":"Широта","lng":"Долгота","images":"Ссылки на фото (по одной в строке)","featured":"Показывать на главной","activitiesLbl":"Занятия (ключи через запятую)","tipsEn":"Советы EN (по одному в строке)","tipsRu":"Советы RU (по одному в строке)","scene":"Стиль иллюстрации","total":"Всего направлений","featuredCount":"На главной","mes   // Offline fallback: schematic SVG map of Kyrgyzstan (used when Leaflet/tiles are unavailable).
  var KG_BORDER = [[71.0, 42.8], [72.4, 42.75], [73.5, 43.0], [74.5, 42.9], [76.0, 43.0], [77.2, 42.95], [78.5, 42.9], [79.2, 42.8], [80.2, 42.2], [79.5, 41.6], [78.5, 41.0], [77.0, 40.9], [76.0, 40.4], [75.0, 40.3], [74.0, 39.6], [73.6, 39.4], [72.0, 39.3], [70.5, 39.6], [69.3, 39.9], [69.5, 40.1], [70.5, 40.0], [71.5, 40.2], [72.4, 40.4], [72.6, 40.85], [72.2, 41.0], [71.6, 41.1], [71.0, 41.0], [70.2, 41.5], [71.0, 42.2]];
  function schematicMap(el, items, opts) {
    opts = opts || {};
    var W = 1000, H = 560, minLng = 69.0, maxLng = 80.6, minLat = 39.0, maxLat = 43.3;
    var kx = Math.cos(41.2 * Math.PI / 180);
    var sx = W / ((maxLng - minLng) * kx), sy = H / (maxLat - minLat), s = Math.min(sx, sy);
    var ox = (W - (maxLng - minLng) * kx * s) / 2, oy = (H - (maxLat - minLat) * s) / 2;
    function P(lng, lat) { return [ox + (lng - minLng) * kx * s, oy + (maxLat - lat) * s]; }
    var border = KG_BORDER.map(function (p) { var q = P(p[0], p[1]); return q[0].toFixed(1) + ',' + q[1].toFixed(1); }).join(' ');
    var ik = P(77.25, 42.42), sk = P(75.12, 41.83);
    var svg = '<svg viewBox="0 0 ' + W + ' ' + H + '" class="schematic" role="img" aria-label="Kyrgyzstan">' +
      '<rect width="' + W + '" height="' + H + '" fill="#e8efe9"/>' +
      '<polygon points="' + border + '" fill="#F2E9D8" stroke="#184E3B" stroke-width="2.5" stroke-linejoin="round"/>' +
      '<ellipse cx="' + ik[0] + '" cy="' + ik[1] + '" rx="' + (0.95 * kx * s) + '" ry="' + (0.27 * s) + '" transform="rotate(-6 ' + ik[0] + ' ' + ik[1] + ')" fill="#9cc9dd" stroke="#3282A6"/>' +
      '<ellipse cx="' + sk[0] + '" cy="' + sk[1] + '" rx="' + (0.14 * kx * s) + '" ry="' + (0.06 * s) + '" fill="#9cc9dd" stroke="#3282A6"/>';

    }
    items.forEach(function (d, i) {

      var col = { culture: '#a0552d', adventure: '#3282A6', relaxation: '#2e8a8a', num: '#3282A6' }[cls] || '#184E3B';

    });
    svg += '<text x="' + (W - 16) + '" y="' + (H - 14) + '" text-anchor="end" font-size="13" fill="#5d6b6c" font-family="Inter,sans-serif">' + esc(t('map.schematic')) + '</text></svg>';
    el.innerHTML = '<div class="schematic-wrap">' + svg + '<div class="sm-pop" hidden></div></div>';
    var pop = el.querySelector('.sm-pop');
    function show(slug) {
      var d = bySlug(slug); if (!d) return;
      var q = P(d.lng, d.lat);
      pop.innerHTML = '<button class="sm-close" aria-label="' + esc(t('common.close')) + '">×</button>' + popupHTML(d);

      '<div class="print-only"><h1>Nomad Way</h1></div>' +

      '<p style="margin:12px 0 0;font-size:.85rem;opacity:.8">' + esc(t('planner.seasonNote', { season: t('seasons.' + plan.input.season).toLowerCase() })) + '</p></div>' +
      '<div class="actions"><button class="btn btn--light" id="saveRoute">' + esc(t('planner.saveRoute')) + '</button><button class="btn btn--outline-light" id="exportPdf">' + esc(t('planner.exportPdf')) + '</button><a class="btn btn--outline-light" id="shareTg" target="_blank" rel="noopener" href="' + esc(tgShareUrl(plan)) + '">' + I.tg.replace('<svg', '<svg width="18" height="18"') + esc(t('planner.shareTg')) + '</a></div></div>' +
      '<ol class="timeline">' + timeline + '</ol><div class="plan-map" id="planMap"></div></div>';
    destroyMaps();
    var mapEl = document.getElementById('planMap');
    if (hasLeaflet()) {
      var m = makeMap(mapEl, [41.5, 75], 7);
      var pts = plan.stops.map(function (s) { return [s.lat, s.lng]; });
      plan.stops.forEach(function (s, i) {
        var d = bySlug(s.slug); if (!d) return;
        L.marker([s.lat, s.lng], { icon: markerIcon('num', i + 1) }).addTo(m).bindPopup(popupHTML(d));
      });
      if (pts.length > 1) { L.polyline(pts, { color: '#3282A6', weight: 4, opacity: .85, dashArray: '8 8' }).addTo(m); m.fitBounds(pts, { padding: [40, 40] }); }
      else if (pts.length) m.setView(pts[0], 9);

      var saved = API.store.get('nw_saved_routes', []);

      toast(t('planner.routeSaved'));

    out.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }
  function tgShareUrl(plan) {
    var lines = [loc(plan.template.title) + ' — ' + t('planner.days', { n: plan.totalDays })];
    var last = null;
    plan.days.forEach(function (day) {
      if (day.slug === last) return;

      var d = bySlug(day.slug);
      if (d) lines.push(t('planner.day', { n: day.day }) + ': ' + loc(d.name));
    });
    var site = location.protocol.indexOf('http') === 0 ? location.origin + location.pathname + '#/planner' : '';
    return 'https://t.me/share/url?url=' + encodeURIComponent(site || 'https://t.me/' + CONTACT.tg) + '&text=' + encodeURIComponent(lines.join('\n'));
  }
