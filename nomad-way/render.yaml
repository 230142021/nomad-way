databases:
  - name: nomad-way-db
    plan: free
    databaseName: nomad_way
    user: nomad_way

services:
  - type: web
    name: nomad-way
    runtime: node
    plan: free
    rootDir: nomad-way
    buildCommand: npm install
    startCommand: npm run db:seed && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: nomad-way-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
